name: 'QEMU Smoke Test'
description: 'Run ESP32 firmware smoke test in QEMU emulator'

inputs:
  config:
    description: 'ESPHome config path used for the build'
    required: false
  firmware:
    description: 'Path to a prebuilt firmware image already suitable for QEMU flash'
    required: false
  elf:
    description: 'Optional ELF path used for stack trace decoding'
    required: false
  chip:
    description: 'ESP32 chip variant (esp32, esp32s3, esp32c3, esp32c6)'
    required: true
  arch:
    description: 'CPU architecture (xtensa, riscv32)'
    required: true
  machine:
    description: 'QEMU machine type (esp32, esp32s3, esp32c3, esp32c6)'
    required: true
  expected_log:
    description: 'Optional regex that must appear in QEMU output for the smoke test to pass'
    required: false

runs:
  using: "composite"
  steps:
    - name: Free disk space
      shell: bash
      run: |
        # Remove unnecessary tools to free space for Docker image (~13GB freed)
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        df -h /

    - name: Find firmware
      id: firmware
      shell: bash
      run: |
        if [ -n "${{ inputs.firmware }}" ]; then
          FIRMWARE="${{ inputs.firmware }}"
          ELF="${{ inputs.elf }}"
          MERGED="true"
        elif [ -n "${{ inputs.config }}" ]; then
          CONFIG_DIR=$(dirname "${{ inputs.config }}")
          BUILD_DIR="$CONFIG_DIR/.esphome/build/espectre/.pioenvs/espectre"
          FIRMWARE="$BUILD_DIR/firmware.factory.bin"
          ELF="$BUILD_DIR/firmware.elf"
          MERGED="false"
        else
          echo "Error: either 'config' or 'firmware' input is required"
          exit 1
        fi

        if [ ! -f "$FIRMWARE" ]; then
          echo "Error: firmware image not found at $FIRMWARE"
          exit 1
        fi

        if [ -n "$ELF" ] && [ ! -f "$ELF" ]; then
          echo "Warning: ELF file not found at $ELF; stack traces will remain raw"
          ELF=""
        fi

        echo "path=$FIRMWARE" >> "$GITHUB_OUTPUT"
        echo "elf=$ELF" >> "$GITHUB_OUTPUT"
        echo "merged=$MERGED" >> "$GITHUB_OUTPUT"
        echo "Found firmware: $FIRMWARE"

    - name: Prepare flash image
      shell: bash
      run: |
        if [ "${{ steps.firmware.outputs.merged }}" = "true" ]; then
          cp "${{ steps.firmware.outputs.path }}" /tmp/flash_qemu.bin
        else
          pip install esptool
          if python -m esptool merge-bin -h >/dev/null 2>&1; then
            python -m esptool --chip ${{ inputs.chip }} merge-bin --pad-to-size 4MB -o /tmp/flash_qemu.bin 0x0 "${{ steps.firmware.outputs.path }}"
          else
            python -m esptool --chip ${{ inputs.chip }} merge_bin --fill-flash-size 4MB -o /tmp/flash_qemu.bin 0x0 "${{ steps.firmware.outputs.path }}"
          fi
        fi
        ls -lh /tmp/flash_qemu.bin

    - name: Pull Docker image
      shell: bash
      run: docker pull espressif/idf:release-v5.5

    - name: Run QEMU
      shell: bash
      run: |
        # Select QEMU binary based on architecture
        if [ "${{ inputs.arch }}" = "xtensa" ]; then
          QEMU_BIN="qemu-system-xtensa"
        else
          QEMU_BIN="qemu-system-riscv32"
        fi
        
        set +e
        docker run --rm \
          -e QEMU_BIN="$QEMU_BIN" \
          -v /tmp/flash_qemu.bin:/flash.bin \
          espressif/idf:release-v5.5 bash -c "
            QEMU_PATH=\$(command -v \"\$QEMU_BIN\")
            if [ -z \"\$QEMU_PATH\" ]; then
              echo \"QEMU binary not found on PATH: \$QEMU_BIN\" >&2
              exit 127
            fi
            timeout 60 \"\$QEMU_PATH\" \
              -nographic \
              -machine ${{ inputs.machine }} \
              -drive file=/flash.bin,if=mtd,format=raw \
              -global driver=timer.${{ inputs.machine }}.timg,property=wdt_disable,value=true \
              -no-reboot 2>&1
          " | tee qemu_output.log
        QEMU_STATUS=${PIPESTATUS[0]}
        set -e

        # 124 is timeout(1), expected for firmware that keeps running after boot.
        if [ "$QEMU_STATUS" -ne 0 ] && [ "$QEMU_STATUS" -ne 124 ]; then
          echo "QEMU failed before smoke checks could complete (exit $QEMU_STATUS)."
          exit "$QEMU_STATUS"
        fi

    - name: Check boot success
      shell: bash
      run: |
        echo "=== QEMU Output (${{ inputs.chip }}) ==="
        cat qemu_output.log
        echo "========================================"
        
        # Filter out known QEMU limitations before crash detection.
        # In ESP-IDF 5.5.x, WiFi/PHY bring-up in QEMU can still fail because
        # QEMU does not emulate the modem clock/register state required by PHY
        # initialization (for example PHY_INIT_MODEM_CLOCK_REQUIRED_BITS). This
        # may surface as esp_phy_enable-related asserts or later PHY panics, and
        # is a known emulator limitation rather than a firmware bug.
        grep -viE "assert failed: esp_phy_enable|phy_module_has_clock_bits|PHY_INIT_MODEM_CLOCK_REQUIRED_BITS" qemu_output.log > qemu_output_filtered.log || true

        # Check for crashes
        if grep -qiE "panic|abort|Guru Meditation|assert failed|stack smashing" qemu_output_filtered.log; then
          echo ""
          echo "SMOKE TEST FAILED - CRASH DETECTED!"
          grep -iE "panic|abort|Guru Meditation|assert failed|stack smashing" qemu_output_filtered.log
          
          # Decode stack trace if backtrace is present
          BACKTRACE=$(grep -oE "Backtrace: [0-9a-fx: ]+" qemu_output.log | head -1 | sed 's/Backtrace: //')
          if [ -n "$BACKTRACE" ]; then
            echo ""
            echo "=== Stack Trace Analysis ==="
              FIRMWARE_ELF="${{ steps.firmware.outputs.elf }}"
            if [ -n "$FIRMWARE_ELF" ]; then
              # Extract addresses and decode with addr2line
              ADDRS=$(echo "$BACKTRACE" | grep -oE "0x[0-9a-f]+" | tr '\n' ' ')
              
              # Select addr2line based on architecture
              if [ "${{ inputs.arch }}" = "xtensa" ]; then
                ADDR2LINE=$(find ~/.platformio/tools -name "xtensa-*-elf-addr2line" 2>/dev/null | head -1)
              else
                ADDR2LINE=$(find ~/.platformio/tools -name "riscv32-*-elf-addr2line" 2>/dev/null | head -1)
              fi
              
              if [ -n "$ADDR2LINE" ]; then
                echo "Using: $ADDR2LINE"
                echo "ELF: $FIRMWARE_ELF"
                echo ""
                $ADDR2LINE -pfiaC -e "$FIRMWARE_ELF" $ADDRS
              else
                echo "addr2line not found, showing raw addresses:"
                echo "$BACKTRACE"
              fi
            else
              echo "ELF file not found, showing raw backtrace:"
              echo "$BACKTRACE"
            fi
          fi
          
          exit 1
        fi
        
        # Track boot progress
        echo ""
        echo "=== Boot Progress Checks ==="
        CHECKS_PASSED=0
        
        if grep -qE "ESP-IDF.*bootloader|boot:" qemu_output.log; then
          echo "[OK] Bootloader started"
          CHECKS_PASSED=$((CHECKS_PASSED + 1))
        fi
        
        if grep -qE "Partition Table|End of partition table" qemu_output.log; then
          echo "[OK] Partition table loaded"
          CHECKS_PASSED=$((CHECKS_PASSED + 1))
        fi
        
        if grep -qE "esp_image: segment|Loaded app from partition" qemu_output.log; then
          echo "[OK] Application image loaded"
          CHECKS_PASSED=$((CHECKS_PASSED + 1))
        fi
        
        if grep -qE "Disabling RNG early entropy source" qemu_output.log; then
          echo "[OK] Bootloader completed, app starting"
          CHECKS_PASSED=$((CHECKS_PASSED + 1))
        fi
        
        echo ""
        echo "Checks passed: $CHECKS_PASSED/4"

        if [ -n "${{ inputs.expected_log }}" ]; then
          echo ""
          echo "=== Expected Log Check ==="
          if grep -qE "${{ inputs.expected_log }}" qemu_output.log; then
            echo "[OK] Expected log matched: ${{ inputs.expected_log }}"
            echo "SMOKE TEST PASSED - Expected runtime marker observed"
          else
            echo "SMOKE TEST FAILED - Expected log not found: ${{ inputs.expected_log }}"
            exit 1
          fi
        elif [ "$CHECKS_PASSED" -ge 3 ]; then
          echo "SMOKE TEST PASSED - Firmware boots without crashes"
        else
          echo "SMOKE TEST FAILED - Boot stalled; only $CHECKS_PASSED/4 checks passed"
          exit 1
        fi
