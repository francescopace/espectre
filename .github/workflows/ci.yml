name: CI

on:
  push:
    branches: [main, develop, v3.0]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-push-origin:
    name: Detect Push Origin
    runs-on: ubuntu-latest
    outputs:
      run_ci: ${{ steps.detect.outputs.run_ci }}
      is_pr_push: ${{ steps.detect.outputs.is_pr_push }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Detect if push commit belongs to merged PR
        id: detect
        uses: actions/github-script@v9
        with:
          script: |
            // Default: run CI unless we prove this is a merged-PR push to develop.
            if (context.eventName !== "push" || context.ref !== "refs/heads/develop") {
              core.setOutput("run_ci", "true");
              core.setOutput("is_pr_push", "false");
              core.info("Not a push on develop. CI will run.");
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;

            const response = await github.request("GET /repos/{owner}/{repo}/commits/{commit_sha}/pulls", {
              owner,
              repo,
              commit_sha: sha,
              mediaType: { previews: ["groot"] }
            });

            const relatedMergedPr = response.data.find((pr) =>
              pr &&
              pr.merged_at &&
              pr.base &&
              pr.base.ref === "develop"
            );

            const isPrPush = Boolean(relatedMergedPr);
            core.setOutput("is_pr_push", isPrPush ? "true" : "false");
            core.setOutput("run_ci", isPrPush ? "false" : "true");

            if (isPrPush) {
              core.info(`Detected merged PR push (PR #${relatedMergedPr.number}). Skipping duplicate CI on develop push.`);
            } else {
              core.info("No merged PR associated with this push commit. Treating as direct push; CI will run.");
            }

  build-site:
    name: Validate Website
    needs: detect-push-origin
    if: needs.detect-push-origin.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Download stable release assets
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p stable-firmware
          mkdir -p stable-sdk
          if gh release view >/dev/null 2>&1; then
            STABLE_TAG="$(gh release view --json tagName --jq '.tagName')"
            gh release download "$STABLE_TAG" --pattern '*.bin' --dir stable-firmware --clobber
            gh release download "$STABLE_TAG" --pattern 'espectre-sdk-*' --pattern 'sdk-manifest-*.json' --dir stable-sdk --clobber
            python .github/scripts/stage_web_firmware.py \
              --firmware-dir stable-firmware \
              --output-dir docs/web/artifacts/firmware/stable \
              --channel stable \
              --version "$STABLE_TAG" \
              --release-tag "$STABLE_TAG" \
              --url-prefix /artifacts/firmware/stable
            python .github/scripts/stage_web_sdk.py \
              --sdk-dir stable-sdk \
              --output-dir docs/web/artifacts/sdk/stable \
              --channel stable
          else
            echo "No stable release found; skipping stable channel staging."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Download snapshot release assets
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p snapshot-firmware
          mkdir -p snapshot-sdk
          if gh release view snapshot >/dev/null 2>&1; then
            gh release download snapshot --pattern '*.bin' --dir snapshot-firmware --clobber
            gh release download snapshot --pattern 'espectre-sdk-*' --pattern 'sdk-manifest-*.json' --dir snapshot-sdk --clobber
            SNAPSHOT_COMMIT="$(gh release view snapshot --json targetCommitish --jq '.targetCommitish // ""')"
            python .github/scripts/stage_web_firmware.py \
              --firmware-dir snapshot-firmware \
              --output-dir docs/web/artifacts/firmware/main \
              --channel main \
              --version main \
              --release-tag snapshot \
              --url-prefix /artifacts/firmware/main \
              --commit "$SNAPSHOT_COMMIT"
            python .github/scripts/stage_web_sdk.py \
              --sdk-dir snapshot-sdk \
              --output-dir docs/web/artifacts/sdk/main \
              --channel main
          else
            echo "No snapshot release found; skipping main channel staging."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
      
      - name: Stage Browser Dependencies
        run: |
          npm --prefix docs/web ci --ignore-scripts
          npm --prefix docs/web run stage:vendor

      - name: Test Web Client
        run: node --test 'test/web/*.mjs'

      - name: Build Static Pages
        run: python3 .github/scripts/build_static_pages.py

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Generate SDK API Reference
        # Written straight into the Pages tree so
        # espectre.dev/artifacts/sdk/api/ serves
        # it. WARN_AS_ERROR is set in the Doxyfile, so a partially documented
        # member on the published surface fails the build here rather than
        # shipping a reference that reads as complete.
        run: |
          # Doxygen creates OUTPUT_DIRECTORY only one level deep, and
          # docs/web/artifacts/ is not tracked because everything under it is
          # generated, so the parent has to exist first.
          mkdir -p docs/web/artifacts/sdk
          ( cat docs/Doxyfile
            echo "OUTPUT_DIRECTORY=docs/web/artifacts/sdk"
            echo "HTML_OUTPUT=api"
          ) | doxygen -

      - name: Verify Website
        run: |
          test -f docs/web/sitemap.xml
          test -f docs/web/index.html
          test -f docs/web/assets/js/app.js
          test -f docs/web/assets/css/styles.css
          test -f docs/web/assets/js/espectre-ble.js
          test -f docs/web/vendor/qrcodejs-1.0.0/qrcode.min.js
          test -f docs/web/vendor/esp-web-tools-10.4.0/install-button.js
          test -f docs/web/vendor/mqtt-5.3.0/mqtt.min.js
          test -f docs/web/privacy/index.html
          for route in flash configure monitor theremin game guides \
              guide-hardware guide-setup guide-placement guide-detection guide-firmware \
              docs docs-api docs-examples docs-architecture media roadmap; do
            grep -q "data-page=\"$route\"" docs/web/index.html \
              || { echo "Missing SPA route: $route"; exit 1; }
          done
          # Retired URLs fall through to this catch-all, served by Pages on 404.
          test -f docs/web/404.html \
            || { echo "Missing 404.html catch-all"; exit 1; }
          # Canonical content pages are generated; the sitemap is committed.
          for guide in hardware setup placement detection custom-firmware; do
            test -f "docs/web/guides/$guide/index.html" \
              || { echo "Missing generated guide page: $guide"; exit 1; }
          done
          test -f docs/web/media/index.html \
            || { echo "Missing generated media page"; exit 1; }
          test -f docs/web/roadmap/index.html \
            || { echo "Missing generated roadmap page"; exit 1; }
          test -f docs/web/artifacts/sdk/api/index.html \
            || { echo "Missing generated SDK API reference"; exit 1; }
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            test -f docs/web/artifacts/firmware/stable/firmware-manifest-stable.json
            test "$(find docs/web/artifacts/firmware/stable -maxdepth 1 -type f -name '*.bin' | wc -l | tr -d ' ')" -eq 15
            test -f docs/web/artifacts/sdk/stable/index.html
            test -f docs/web/artifacts/sdk/stable/sdk-manifest-stable.json
            test -f docs/web/artifacts/sdk/main/index.html
            test -f docs/web/artifacts/sdk/main/sdk-manifest-main.json
          fi
          echo "Website verified!"
      
      - name: Setup Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      
      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/web

  deploy-site:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build-site
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  notify-indexnow:
    name: Notify IndexNow
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: deploy-site
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Extract URLs and notify IndexNow
        run: |
          # Extract URLs from sitemap
          URLS=$(grep -oP '(?<=<loc>)[^<]+' docs/web/sitemap.xml | jq -R -s -c 'split("\n") | map(select(length > 0))')
          
          # Notify IndexNow (Bing, Yandex, Seznam, Naver)
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"espectre.dev\",\"key\":\"1a2e73ccf9558a06830546c288699e0c\",\"keyLocation\":\"https://espectre.dev/1a2e73ccf9558a06830546c288699e0c.txt\",\"urlList\":$URLS}"
          
          echo "Notified IndexNow with $(echo "$URLS" | jq length) URLs"

  test-cpp:
    name: C++ Unit Tests
    needs: detect-push-origin
    if: needs.detect-push-origin.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Host-side Tests with Coverage
        run: ./test/cpp/run_coverage.sh --ci
      
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: test/cpp/coverage.xml,test/cpp/coverage.lcov
          flags: cpp
          fail_ci_if_error: true
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-python:
    name: Python Unit Tests
    needs: detect-push-origin
    if: needs.detect-push-origin.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore shared NPZ cache
        uses: actions/cache@v6
        with:
          path: .npz_cache
          key: ${{ format('npz-cache-v1-{0}-{1}', runner.os, hashFiles('data/dataset_info.json', 'src/python/micro_espectre/runtime_policy.py', 'tools/lib/csi_io.py', 'tools/lib/dataset_metadata.py', 'tools/lib/npz_cache.py', 'tools/lib/performance_report.py', 'tools/train_ml_model.py', 'tools/validate_dataset_quality.py', 'test/python/test_packet_rate_adaptation_regression.py')) }}
          restore-keys: |
            npz-cache-v1-${{ runner.os }}-

      - name: Run Product and Performance Tests with Coverage
        run: |
          pytest test/python -n auto --dist worksteal -v --cov=src/python/micro_espectre --cov=src/python/espectre_cli --cov-report=xml --cov-report=term-missing
        env:
          PYTEST_XDIST_AUTO_NUM_WORKERS: '4'
      
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: python
          fail_ci_if_error: true
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build-esphome:
    name: Build ESPHome ${{ matrix.chip }}
    runs-on: ubuntu-latest
    needs: detect-push-origin
    if: needs.detect-push-origin.outputs.run_ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: ESP32
            config: src/cpp/frontend/esphome/examples/espectre-esp32.yaml
          - chip: ESP32-S3
            config: src/cpp/frontend/esphome/examples/espectre-s3.yaml
          - chip: ESP32-C3
            config: src/cpp/frontend/esphome/examples/espectre-c3.yaml
          - chip: ESP32-C5
            config: src/cpp/frontend/esphome/examples/espectre-c5.yaml
          - chip: ESP32-C6
            config: src/cpp/frontend/esphome/examples/espectre-c6.yaml
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      
      - name: Restore ESPHome build toolchain cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.esphome/cache
          key: pio-${{ runner.os }}-${{ matrix.chip }}-${{ hashFiles('requirements.txt', 'espectre', 'src/python/espectre_cli/*.py', 'src/cpp/frontend/esphome/examples/*.yaml') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ matrix.chip }}-
            pio-${{ runner.os }}-
      
      - name: Install ESPHome
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Prepare ESPHome config
        id: esphome-config
        run: |
          CONFIG_PATH="${{ matrix.config }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CONFIG_PATH="src/cpp/frontend/esphome/examples/.ci-${{ matrix.chip }}.yaml"
            MATRIX_CONFIG="${{ matrix.config }}" MATRIX_CHIP="${{ matrix.chip }}" python3 -c 'from pathlib import Path; import os; src = Path(os.environ["MATRIX_CONFIG"]); chip = os.environ["MATRIX_CHIP"]; dst = Path(f"src/cpp/frontend/esphome/examples/.ci-{chip}.yaml"); text = src.read_text(encoding="utf-8"); old = "external_components:\n  - source:\n      type: git\n      url: https://github.com/francescopace/espectre\n      ref: ${git_ref}\n      path: src/cpp/frontend/esphome/components\n    components: [ espectre ]\n    refresh: always\n"; new = "external_components:\n  - source:\n      type: local\n      path: ../components\n    components: [ espectre ]\n"; assert old in text, "expected external_components block not found"; dst.write_text(text.replace(old, new), encoding="utf-8")'
          fi
          echo "config_path=${CONFIG_PATH}" >> "$GITHUB_OUTPUT"

      - name: Compile
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            esphome -s git_ref "${{ github.sha }}" -s detection_algorithm classic compile "${{ steps.esphome-config.outputs.config_path }}"
          else
            esphome -s detection_algorithm classic compile "${{ steps.esphome-config.outputs.config_path }}"
          fi

      - name: Locate ESPHome factory image
        id: esphome-artifacts
        run: |
          FACTORY_BIN="$(python3 -c 'from pathlib import Path; matches = sorted(Path("src/cpp/frontend/esphome/examples/.esphome/build").glob("**/firmware.factory.bin")); assert matches, "firmware.factory.bin not found"; print(matches[0])')"
          echo "factory_bin=${FACTORY_BIN}" >> "$GITHUB_OUTPUT"

      - name: Rename ESPHome firmware
        if: github.event_name == 'push'
        run: |
          mkdir -p output
          CHIP=$(echo "${{ matrix.chip }}" | tr '[:upper:]' '[:lower:]' | tr -d '-')
          if [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            PREFIX="espectre-snapshot-dev"
          else
            PREFIX="espectre-snapshot"
          fi
          cp "${{ steps.esphome-artifacts.outputs.factory_bin }}" "output/${PREFIX}-${CHIP}.bin"

      - name: Upload ESPHome firmware artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: firmware-esphome-${{ matrix.chip }}
          path: output/espectre-snapshot*.bin
          retention-days: 7

  build-matter:
    name: Build Matter ${{ matrix.chip }}
    runs-on: ubuntu-latest
    needs: detect-push-origin
    if: needs.detect-push-origin.outputs.run_ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: ESP32
            target: esp32
            sdkconfig_defaults: sdkconfig.defaults;sdkconfig.esp32.defaults
          - chip: ESP32-C3
            target: esp32c3
          - chip: ESP32-C5
            target: esp32c5
          - chip: ESP32-C6
            target: esp32c6
          - chip: ESP32-S3
            target: esp32s3

    steps:
      - uses: actions/checkout@v7

      - name: Select Matter artifact names
        id: matter-names
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "prefix=ci" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "prefix=snapshot-dev" >> "$GITHUB_OUTPUT"
          else
            echo "prefix=snapshot" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Matter toolchain and components
        uses: actions/cache@v6
        with:
          path: |
            .github/.cache/matter-home
            src/cpp/frontend/matter/app/managed_components
          key: matter-${{ runner.os }}-idf-v5.5-${{ matrix.target }}-${{ hashFiles('espectre', 'src/python/espectre_cli/*.py', '.github/scripts/build_matter_firmware.sh', 'src/cpp/frontend/matter/app/dependencies.lock', 'src/cpp/frontend/matter/app/main/idf_component.yml', 'src/cpp/frontend/matter/app/sdkconfig*.defaults', 'src/cpp/frontend/matter/app/partitions.csv') }}
          restore-keys: |
            matter-${{ runner.os }}-idf-v5.5-${{ matrix.target }}-
            matter-${{ runner.os }}-idf-v5.5-

      - name: Build Matter firmware
        run: |
          mkdir -p output
          .github/scripts/build_matter_firmware.sh
        env:
          MATTER_TARGET: ${{ matrix.target }}
          MATTER_OUTPUT: ${{ github.workspace }}/output/espectre-matter-${{ steps.matter-names.outputs.prefix }}-${{ matrix.target }}.bin
          MATTER_SDKCONFIG_DEFAULTS: ${{ matrix.sdkconfig_defaults || '' }}

      - name: Upload Matter firmware artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: firmware-matter-${{ matrix.chip }}
          path: output/espectre-matter-snapshot*.bin
          retention-days: 7

  build-native:
    name: Build Native ${{ matrix.chip }}
    runs-on: ubuntu-latest
    needs: detect-push-origin
    if: needs.detect-push-origin.outputs.run_ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: ESP32
            target: esp32
            sdkconfig_defaults: sdkconfig.defaults;sdkconfig.esp32.defaults
          - chip: ESP32-C3
            target: esp32c3
          - chip: ESP32-C5
            target: esp32c5
          - chip: ESP32-C6
            target: esp32c6
          - chip: ESP32-S3
            target: esp32s3

    steps:
      - uses: actions/checkout@v7

      - name: Select native artifact names
        id: native-names
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "prefix=ci" >> "$GITHUB_OUTPUT"
            echo "ota_snapshot=0" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "prefix=snapshot-dev" >> "$GITHUB_OUTPUT"
            echo "ota_snapshot=1" >> "$GITHUB_OUTPUT"
          else
            echo "prefix=snapshot" >> "$GITHUB_OUTPUT"
            echo "ota_snapshot=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache native toolchain
        uses: actions/cache@v6
        with:
          path: .github/.cache/native-home
          key: native-${{ runner.os }}-idf-v5.5-${{ matrix.target }}-${{ hashFiles('espectre', 'src/python/espectre_cli/*.py', '.github/scripts/build_native_firmware.sh', 'src/cpp/frontend/native/app/dependencies.lock', 'src/cpp/frontend/native/app/sdkconfig*.defaults', 'src/cpp/frontend/native/app/partitions.csv') }}
          restore-keys: |
            native-${{ runner.os }}-idf-v5.5-${{ matrix.target }}-
            native-${{ runner.os }}-idf-v5.5-

      - name: Build native firmware
        run: |
          mkdir -p output
          bash .github/scripts/build_native_firmware.sh
        env:
          NATIVE_TARGET: ${{ matrix.target }}
          NATIVE_OUTPUT: ${{ github.workspace }}/output/espectre-native-${{ steps.native-names.outputs.prefix }}-${{ matrix.target }}.bin
          NATIVE_OTA_OUTPUT: ${{ github.workspace }}/output/espectre-native-${{ steps.native-names.outputs.prefix }}-${{ matrix.target }}-ota.bin
          NATIVE_OTA_SNAPSHOT: ${{ steps.native-names.outputs.ota_snapshot }}
          NATIVE_SDKCONFIG_DEFAULTS: ${{ matrix.sdkconfig_defaults || '' }}

      - name: Upload native firmware artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: firmware-native-${{ matrix.chip }}
          path: output/espectre-native-snapshot*.bin
          retention-days: 7

  build-streamer:
    name: Build Streamer ${{ matrix.chip }}
    runs-on: ubuntu-latest
    needs: detect-push-origin
    if: needs.detect-push-origin.outputs.run_ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: ESP32
            target: esp32
          - chip: ESP32-C3
            target: esp32c3
          - chip: ESP32-C5
            target: esp32c5
          - chip: ESP32-C6
            target: esp32c6
          - chip: ESP32-S3
            target: esp32s3

    steps:
      - uses: actions/checkout@v7

      - name: Cache streamer toolchain
        uses: actions/cache@v6
        with:
          path: .github/.cache/streamer-home
          key: streamer-${{ runner.os }}-idf-v5.5-${{ matrix.target }}-${{ hashFiles('espectre', 'src/python/espectre_cli/*.py', '.github/scripts/build_streamer_firmware.sh', 'src/cpp/frontend/streamer/app/sdkconfig*.defaults', 'src/cpp/frontend/streamer/app/partitions.csv') }}
          restore-keys: |
            streamer-${{ runner.os }}-idf-v5.5-${{ matrix.target }}-
            streamer-${{ runner.os }}-idf-v5.5-

      - name: Build streamer firmware
        run: |
          mkdir -p output
          bash .github/scripts/build_streamer_firmware.sh
        env:
          STREAMER_TARGET: ${{ matrix.target }}
          STREAMER_OUTPUT: ${{ github.workspace }}/output/espectre-streamer-ci-${{ matrix.target }}.bin

  build-sdk:
    name: Build SDK Package
    runs-on: ubuntu-latest
    needs: detect-push-origin
    if: needs.detect-push-origin.outputs.run_ci == 'true'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Select SDK release metadata
        id: sdk
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "channel=main" >> "$GITHUB_OUTPUT"
            echo "version=pr-preview" >> "$GITHUB_OUTPUT"
            echo "release_tag=pr-preview" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "channel=develop" >> "$GITHUB_OUTPUT"
            echo "version=develop" >> "$GITHUB_OUTPUT"
            echo "release_tag=snapshot-dev" >> "$GITHUB_OUTPUT"
          else
            echo "channel=main" >> "$GITHUB_OUTPUT"
            echo "version=main" >> "$GITHUB_OUTPUT"
            echo "release_tag=snapshot" >> "$GITHUB_OUTPUT"
          fi

      - name: Build SDK package
        run: |
          mkdir -p output
          python .github/scripts/build_sdk_package.py \
            --channel "${{ steps.sdk.outputs.channel }}" \
            --version "${{ steps.sdk.outputs.version }}" \
            --release-tag "${{ steps.sdk.outputs.release_tag }}" \
            --output-dir output \
            --commit "${{ github.sha }}"

      - name: Upload SDK package artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: sdk-bundle
          path: |
            output/espectre-sdk-*.tar.gz
            output/espectre-sdk-*.zip
            output/sdk-manifest-*.json
          retention-days: 7
