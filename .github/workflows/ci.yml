name: CI

on:
  push:
    branches: [main, develop, v3.0]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-push-origin:
    name: Detect Push Origin
    runs-on: ubuntu-latest
    outputs:
      run_ci: ${{ steps.detect.outputs.run_ci }}
      is_pr_push: ${{ steps.detect.outputs.is_pr_push }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Detect if push commit belongs to merged PR
        id: detect
        uses: actions/github-script@v9
        with:
          script: |
            // Default: run CI unless we prove this is a merged-PR push to develop.
            if (context.eventName !== "push" || context.ref !== "refs/heads/develop") {
              core.setOutput("run_ci", "true");
              core.setOutput("is_pr_push", "false");
              core.info("Not a push on develop. CI will run.");
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;

            const response = await github.request("GET /repos/{owner}/{repo}/commits/{commit_sha}/pulls", {
              owner,
              repo,
              commit_sha: sha,
              mediaType: { previews: ["groot"] }
            });

            const relatedMergedPr = response.data.find((pr) =>
              pr &&
              pr.merged_at &&
              pr.base &&
              pr.base.ref === "develop"
            );

            const isPrPush = Boolean(relatedMergedPr);
            core.setOutput("is_pr_push", isPrPush ? "true" : "false");
            core.setOutput("run_ci", isPrPush ? "false" : "true");

            if (isPrPush) {
              core.info(`Detected merged PR push (PR #${relatedMergedPr.number}). Skipping duplicate CI on develop push.`);
            } else {
              core.info("No merged PR associated with this push commit. Treating as direct push; CI will run.");
            }

  build-site:
    name: Validate Website
    needs: detect-push-origin
    if: needs.detect-push-origin.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Download stable release assets
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p stable-firmware
          if gh release view >/dev/null 2>&1; then
            STABLE_TAG="$(gh release view --json tagName --jq '.tagName')"
            gh release download "$STABLE_TAG" --pattern '*.bin' --dir stable-firmware --clobber
            python .github/scripts/stage_web_firmware.py \
              --firmware-dir stable-firmware \
              --output-dir docs/web/flash/firmware/stable \
              --channel stable \
              --version "$STABLE_TAG" \
              --release-tag "$STABLE_TAG" \
              --url-prefix /flash/firmware/stable
          else
            echo "No stable release found; skipping stable channel staging."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Download snapshot release assets
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p snapshot-firmware
          if gh release view snapshot >/dev/null 2>&1; then
            gh release download snapshot --pattern '*.bin' --dir snapshot-firmware --clobber
            SNAPSHOT_COMMIT="$(gh release view snapshot --json targetCommitish --jq '.targetCommitish // ""')"
            python .github/scripts/stage_web_firmware.py \
              --firmware-dir snapshot-firmware \
              --output-dir docs/web/flash/firmware/main \
              --channel main \
              --version main \
              --release-tag snapshot \
              --url-prefix /flash/firmware/main \
              --commit "$SNAPSHOT_COMMIT"
          else
            echo "No snapshot release found; skipping main channel staging."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
      
      - name: Verify Website
        run: |
          test -f docs/web/sitemap.xml
          test -f docs/web/configure/index.html
          test -f docs/web/monitor/index.html
          test -f docs/web/theremin/index.html
          test -f docs/web/guides/setup/index.html
          test -f docs/web/guides/detection/index.html
          test -f docs/web/guides/custom-firmware/index.html
          test -f docs/web/guides/hardware/index.html
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            test -f docs/web/flash/firmware/stable/firmware-manifest-stable.json
            test "$(find docs/web/flash/firmware/stable -maxdepth 1 -type f -name '*.bin' | wc -l | tr -d ' ')" -eq 15
          fi
          echo "Website verified!"
      
      - name: Setup Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      
      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/web

  deploy-site:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build-site
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  notify-indexnow:
    name: Notify IndexNow
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: deploy-site
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Extract URLs and notify IndexNow
        run: |
          # Extract URLs from sitemap
          URLS=$(grep -oP '(?<=<loc>)[^<]+' docs/web/sitemap.xml | jq -R -s -c 'split("\n") | map(select(length > 0))')
          
          # Notify IndexNow (Bing, Yandex, Seznam, Naver)
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"espectre.dev\",\"key\":\"1a2e73ccf9558a06830546c288699e0c\",\"keyLocation\":\"https://espectre.dev/1a2e73ccf9558a06830546c288699e0c.txt\",\"urlList\":$URLS}"
          
          echo "Notified IndexNow with $(echo "$URLS" | jq length) URLs"

  test-cpp:
    name: C++ Unit Tests
    needs: detect-push-origin
    if: needs.detect-push-origin.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Host-side Tests with Coverage
        run: ./test/cpp/run_coverage.sh --ci
      
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: test/cpp/coverage.xml,test/cpp/coverage.lcov
          flags: cpp
          fail_ci_if_error: true
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-python:
    name: Python Unit Tests
    needs: detect-push-origin
    if: needs.detect-push-origin.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-ml.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-ml.txt

      - name: Run Tests with Coverage
        run: |
          pytest test/python -n auto --dist worksteal -v --cov=src/python/micro_espectre --cov=src/python/espectre_cli --cov-report=xml --cov-report=term-missing
      
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: python
          fail_ci_if_error: true
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: ${{ matrix.qemu_chip && 'Smoke Test' || 'Build' }} ${{ matrix.chip }}
    runs-on: ubuntu-latest
    needs: detect-push-origin
    if: needs.detect-push-origin.outputs.run_ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Standard builds (no QEMU)
          # config: production file (GitHub component), config_dev: local component
          - chip: ESP32
            config: examples/espectre-esp32.yaml
            config_dev: examples/espectre-esp32-dev.yaml
          - chip: ESP32-S3
            config: examples/espectre-s3.yaml
            config_dev: examples/espectre-s3-dev.yaml
          - chip: ESP32-C3
            config: examples/espectre-c3.yaml
            config_dev: examples/espectre-c3-dev.yaml
          - chip: ESP32-C5
            config: examples/espectre-c5.yaml
            config_dev: examples/espectre-c5-dev.yaml
          - chip: ESP32-C6
            config: examples/espectre-c6.yaml
            config_dev: examples/espectre-c6-dev.yaml
          # QEMU smoke tests (.github/actions/qemu-smoke-test/configs/)
          # Supported targets: ESP32, ESP32-S3, ESP32-C3 (official Espressif QEMU fork)
          # WiFi PHY is not emulated by QEMU; the PHY assert is filtered in the CI action
          # ESP32-C6 and newer chips are not supported by the Espressif QEMU fork
          - chip: ESP32
            config: .github/actions/qemu-smoke-test/configs/esp32.yaml
            qemu_chip: esp32
            qemu_arch: xtensa
            qemu_machine: esp32
          - chip: ESP32-S3
            config: .github/actions/qemu-smoke-test/configs/esp32s3.yaml
            qemu_chip: esp32s3
            qemu_arch: xtensa
            qemu_machine: esp32s3
          - chip: ESP32-C3
            config: .github/actions/qemu-smoke-test/configs/esp32c3.yaml
            qemu_chip: esp32c3
            qemu_arch: riscv32
            qemu_machine: esp32c3
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      
      - name: Restore ESPHome build toolchain cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.esphome/cache
          key: pio-${{ runner.os }}-${{ matrix.qemu_chip || matrix.chip }}-${{ hashFiles('requirements.txt', 'espectre', 'src/python/espectre_cli/*.py', 'examples/*.yaml', '.github/actions/qemu-smoke-test/configs/*.yaml') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ matrix.qemu_chip || matrix.chip }}-
            pio-${{ runner.os }}-
      
      - name: Install ESPHome
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create secrets.yaml for dev configs
        if: github.ref != 'refs/heads/main' && !matrix.qemu_chip
        run: |
          cat > examples/secrets.yaml << 'EOF'
          wifi_ssid: CI_TEST
          wifi_password: ci_password
          EOF
      
      - name: Compile
        run: |
          # QEMU configs always use local component (no branch distinction)
          # Standard configs use -dev (local component) on develop/PR, production on main
          if [ -n "${{ matrix.qemu_chip }}" ]; then
            ./espectre esphome build --config ${{ matrix.config }} --clean
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ./espectre esphome build --config ${{ matrix.config }} --clean
          else
            ./espectre esphome build --config ${{ matrix.config_dev }} --clean
          fi
      
      # QEMU smoke test for UART builds
      - name: Run QEMU smoke test
        if: matrix.qemu_chip
        uses: ./.github/actions/qemu-smoke-test
        with:
          config: ${{ matrix.config }}
          chip: ${{ matrix.qemu_chip }}
          arch: ${{ matrix.qemu_arch }}
          machine: ${{ matrix.qemu_machine }}
      
      - name: Upload QEMU logs
        if: matrix.qemu_chip && always()
        uses: actions/upload-artifact@v7
        with:
          name: qemu-logs-${{ matrix.qemu_machine }}
          path: qemu_output.log
          retention-days: 7

  build-matter:
    name: ${{ matrix.qemu_machine && 'Smoke Test Matter' || 'Build Matter' }} ${{ matrix.chip }}
    runs-on: ubuntu-latest
    needs: detect-push-origin
    if: needs.detect-push-origin.outputs.run_ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: ESP32
            target: esp32
            qemu_arch: xtensa
            qemu_machine: esp32
            sdkconfig_defaults: sdkconfig.defaults;sdkconfig.qemu.defaults
            qemu_expected_log: "ESPectre Matter smoke marker: endpoint .* configured, starting Matter stack"
          - chip: ESP32-C3
            target: esp32c3
            qemu_arch: riscv32
            qemu_machine: esp32c3
            sdkconfig_defaults: sdkconfig.defaults;sdkconfig.qemu.defaults
            qemu_expected_log: "ESPectre Matter smoke marker: endpoint .* configured, starting Matter stack"
          - chip: ESP32-C5
            target: esp32c5
          - chip: ESP32-C6
            target: esp32c6
          - chip: ESP32-S3
            target: esp32s3
            qemu_arch: xtensa
            qemu_machine: esp32s3
            sdkconfig_defaults: sdkconfig.defaults;sdkconfig.qemu.defaults
            qemu_expected_log: "ESPectre Matter smoke marker: endpoint .* configured, starting Matter stack"

    steps:
      - uses: actions/checkout@v7

      - name: Cache Matter toolchain and components
        uses: actions/cache@v6
        with:
          path: |
            .github/.cache/matter-home
            src/cpp/frontend/matter/app/managed_components
          key: matter-${{ runner.os }}-idf-v5.5-${{ matrix.target }}-${{ hashFiles('espectre', 'src/python/espectre_cli/*.py', '.github/scripts/build_matter_firmware.sh', 'src/cpp/frontend/matter/app/dependencies.lock', 'src/cpp/frontend/matter/app/main/idf_component.yml', 'src/cpp/frontend/matter/app/sdkconfig*.defaults', 'src/cpp/frontend/matter/app/partitions.csv') }}
          restore-keys: |
            matter-${{ runner.os }}-idf-v5.5-${{ matrix.target }}-
            matter-${{ runner.os }}-idf-v5.5-

      - name: Build Matter firmware
        run: |
          mkdir -p output
          .github/scripts/build_matter_firmware.sh
        env:
          MATTER_TARGET: ${{ matrix.target }}
          MATTER_OUTPUT: ${{ github.workspace }}/output/espectre-matter-ci-${{ matrix.target }}.bin
          MATTER_SDKCONFIG_DEFAULTS: ${{ matrix.sdkconfig_defaults || '' }}

      - name: Run Matter QEMU smoke test
        if: matrix.qemu_machine
        uses: ./.github/actions/qemu-smoke-test
        with:
          firmware: ${{ github.workspace }}/output/espectre-matter-ci-${{ matrix.target }}.bin
          elf: ${{ github.workspace }}/src/cpp/frontend/matter/app/build-${{ matrix.target }}/espectre-matter.elf
          chip: ${{ matrix.target }}
          arch: ${{ matrix.qemu_arch }}
          machine: ${{ matrix.qemu_machine }}
          expected_log: ${{ matrix.qemu_expected_log || '' }}

      - name: Upload Matter QEMU logs
        if: matrix.qemu_machine && always()
        uses: actions/upload-artifact@v7
        with:
          name: qemu-matter-logs-${{ matrix.qemu_machine }}
          path: qemu_output.log
          retention-days: 7

  build-native:
    name: ${{ matrix.qemu_machine && 'Smoke Test Native' || 'Build Native' }} ${{ matrix.chip }}
    runs-on: ubuntu-latest
    needs: detect-push-origin
    if: needs.detect-push-origin.outputs.run_ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: ESP32
            target: esp32
            qemu_arch: xtensa
            qemu_machine: esp32
            sdkconfig_defaults: sdkconfig.defaults;sdkconfig.qemu.defaults
            qemu_expected_log: "ESPectre native smoke marker: transport configured, starting native frontend"
          - chip: ESP32-C3
            target: esp32c3
            qemu_arch: riscv32
            qemu_machine: esp32c3
            sdkconfig_defaults: sdkconfig.defaults;sdkconfig.qemu.defaults
            qemu_expected_log: "ESPectre native smoke marker: transport configured, starting native frontend"
          - chip: ESP32-C5
            target: esp32c5
          - chip: ESP32-C6
            target: esp32c6
          - chip: ESP32-S3
            target: esp32s3
            qemu_arch: xtensa
            qemu_machine: esp32s3
            sdkconfig_defaults: sdkconfig.defaults;sdkconfig.qemu.defaults
            qemu_expected_log: "ESPectre native smoke marker: transport configured, starting native frontend"

    steps:
      - uses: actions/checkout@v7

      - name: Cache native toolchain
        uses: actions/cache@v6
        with:
          path: .github/.cache/native-home
          key: native-${{ runner.os }}-idf-v5.5-${{ matrix.target }}-${{ hashFiles('espectre', 'src/python/espectre_cli/*.py', '.github/scripts/build_native_firmware.sh', 'src/cpp/frontend/native/app/dependencies.lock', 'src/cpp/frontend/native/app/sdkconfig*.defaults', 'src/cpp/frontend/native/app/partitions.csv') }}
          restore-keys: |
            native-${{ runner.os }}-idf-v5.5-${{ matrix.target }}-
            native-${{ runner.os }}-idf-v5.5-

      - name: Build native firmware
        run: |
          mkdir -p output
          bash .github/scripts/build_native_firmware.sh
        env:
          NATIVE_TARGET: ${{ matrix.target }}
          NATIVE_OUTPUT: ${{ github.workspace }}/output/espectre-native-ci-${{ matrix.target }}.bin
          NATIVE_SDKCONFIG_DEFAULTS: ${{ matrix.sdkconfig_defaults || '' }}

      - name: Run native QEMU smoke test
        if: matrix.qemu_machine
        uses: ./.github/actions/qemu-smoke-test
        with:
          firmware: ${{ github.workspace }}/output/espectre-native-ci-${{ matrix.target }}.bin
          elf: ${{ github.workspace }}/src/cpp/frontend/native/app/build-${{ matrix.target }}/espectre-native.elf
          chip: ${{ matrix.target }}
          arch: ${{ matrix.qemu_arch }}
          machine: ${{ matrix.qemu_machine }}
          expected_log: ${{ matrix.qemu_expected_log || '' }}

      - name: Upload native QEMU logs
        if: matrix.qemu_machine && always()
        uses: actions/upload-artifact@v7
        with:
          name: qemu-native-logs-${{ matrix.qemu_machine }}
          path: qemu_output.log
          retention-days: 7

      - name: Upload native firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-native-${{ matrix.chip }}
          path: output/espectre-native-*.bin
          retention-days: 7

  build-streamer:
    name: ${{ matrix.qemu_machine && 'Smoke Test Streamer' || 'Build Streamer' }} ${{ matrix.chip }}
    runs-on: ubuntu-latest
    needs: detect-push-origin
    if: needs.detect-push-origin.outputs.run_ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: ESP32
            target: esp32
            qemu_arch: xtensa
            qemu_machine: esp32
            sdkconfig_defaults: sdkconfig.defaults;sdkconfig.qemu.defaults
            qemu_expected_log: "ESPectre streamer smoke marker: transport configured, starting streamer frontend"
          - chip: ESP32-C3
            target: esp32c3
            qemu_arch: riscv32
            qemu_machine: esp32c3
            sdkconfig_defaults: sdkconfig.defaults;sdkconfig.qemu.defaults
            qemu_expected_log: "ESPectre streamer smoke marker: transport configured, starting streamer frontend"
          - chip: ESP32-C5
            target: esp32c5
          - chip: ESP32-C6
            target: esp32c6
          - chip: ESP32-S3
            target: esp32s3
            qemu_arch: xtensa
            qemu_machine: esp32s3
            sdkconfig_defaults: sdkconfig.defaults;sdkconfig.qemu.defaults
            qemu_expected_log: "ESPectre streamer smoke marker: transport configured, starting streamer frontend"

    steps:
      - uses: actions/checkout@v7

      - name: Cache streamer toolchain
        uses: actions/cache@v6
        with:
          path: .github/.cache/streamer-home
          key: streamer-${{ runner.os }}-idf-v5.5-${{ matrix.target }}-${{ hashFiles('espectre', 'src/python/espectre_cli/*.py', '.github/scripts/build_streamer_firmware.sh', 'src/cpp/frontend/streamer/app/sdkconfig*.defaults', 'src/cpp/frontend/streamer/app/partitions.csv') }}
          restore-keys: |
            streamer-${{ runner.os }}-idf-v5.5-${{ matrix.target }}-
            streamer-${{ runner.os }}-idf-v5.5-

      - name: Build streamer firmware
        run: |
          mkdir -p output
          bash .github/scripts/build_streamer_firmware.sh
        env:
          STREAMER_TARGET: ${{ matrix.target }}
          STREAMER_OUTPUT: ${{ github.workspace }}/output/espectre-streamer-ci-${{ matrix.target }}.bin
          STREAMER_SDKCONFIG_DEFAULTS: ${{ matrix.sdkconfig_defaults || '' }}

      - name: Run streamer QEMU smoke test
        if: matrix.qemu_machine
        uses: ./.github/actions/qemu-smoke-test
        with:
          firmware: ${{ github.workspace }}/output/espectre-streamer-ci-${{ matrix.target }}.bin
          elf: ${{ github.workspace }}/src/cpp/frontend/streamer/app/build-${{ matrix.target }}/espectre-streamer.elf
          chip: ${{ matrix.target }}
          arch: ${{ matrix.qemu_arch }}
          machine: ${{ matrix.qemu_machine }}
          expected_log: ${{ matrix.qemu_expected_log || '' }}

      - name: Upload streamer QEMU logs
        if: matrix.qemu_machine && always()
        uses: actions/upload-artifact@v7
        with:
          name: qemu-streamer-logs-${{ matrix.qemu_machine }}
          path: qemu_output.log
          retention-days: 7

      - name: Upload streamer firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-streamer-${{ matrix.chip }}
          path: output/espectre-streamer-*.bin
          retention-days: 7
