name: Snapshot

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  check-changes:
    name: Check Code Changes
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    outputs:
      should_build: ${{ steps.filter.outputs.code }}
    
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      
      - name: Check for code changes
        id: filter
        run: |
          # Check if any code files changed in the last commit
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(src/|examples/[^/]+\.yaml$|\.github/workflows/snapshot\.yml$|\.github/scripts/build_[^/]+_firmware\.sh$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Code changes detected, will build snapshot"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "No code changes, skipping snapshot"
          fi

  build:
    name: Build ${{ matrix.chip }}
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: ESP32
            config: examples/espectre-esp32.yaml
          - chip: ESP32-S3
            config: examples/espectre-s3.yaml
          - chip: ESP32-C3
            config: examples/espectre-c3.yaml
          - chip: ESP32-C5
            config: examples/espectre-c5.yaml
          - chip: ESP32-C6
            config: examples/espectre-c6.yaml
    
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      
      - name: Cache ESPHome build toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.esphome/cache
          key: pio-${{ runner.os }}-${{ matrix.chip }}-${{ hashFiles('requirements.txt', 'examples/*.yaml', '.github/actions/qemu-smoke-test/configs/*.yaml') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ matrix.chip }}-
            pio-${{ runner.os }}-
      
      - name: Install ESPHome
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Compile
        run: esphome -s git_ref ${{ github.event.workflow_run.head_sha }} -s detection_algorithm classic compile ${{ matrix.config }}
      
      - name: Rename firmware files
        run: |
          mkdir -p output
          CHIP=$(echo "${{ matrix.chip }}" | tr '[:upper:]' '[:lower:]' | tr -d '-')
          find examples/.esphome/build -name "firmware.factory.bin" -exec cp {} output/ \;
          mv "output/firmware.factory.bin" "output/espectre-snapshot-${CHIP}.bin"
      
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.chip }}
          path: output/espectre-snapshot-*.bin
          retention-days: 1

  build-matter:
    name: Build Matter ${{ matrix.chip }}
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: ESP32
            target: esp32
          - chip: ESP32-C3
            target: esp32c3
          - chip: ESP32-C5
            target: esp32c5
          - chip: ESP32-C6
            target: esp32c6
          - chip: ESP32-S3
            target: esp32s3

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Cache Matter toolchain and components
        uses: actions/cache@v6
        with:
          path: |
            .github/.cache/matter-home
            src/cpp/frontend/matter/app/managed_components
          key: matter-${{ runner.os }}-idf-v5.5-${{ matrix.target }}-${{ hashFiles('.github/scripts/build_matter_firmware.sh', 'src/cpp/frontend/matter/app/dependencies.lock', 'src/cpp/frontend/matter/app/main/idf_component.yml', 'src/cpp/frontend/matter/app/sdkconfig*.defaults', 'src/cpp/frontend/matter/app/partitions.csv') }}
          restore-keys: |
            matter-${{ runner.os }}-idf-v5.5-${{ matrix.target }}-
            matter-${{ runner.os }}-idf-v5.5-

      - name: Build Matter firmware
        run: |
          mkdir -p output
          .github/scripts/build_matter_firmware.sh
        env:
          MATTER_TARGET: ${{ matrix.target }}
          MATTER_OUTPUT: ${{ github.workspace }}/output/espectre-matter-snapshot-${{ matrix.target }}.bin

      - name: Upload Matter firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-matter-${{ matrix.chip }}
          path: output/espectre-matter-*.bin
          retention-days: 1

  build-native:
    name: Build native ${{ matrix.chip }}
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: ESP32
            target: esp32
          - chip: ESP32-C3
            target: esp32c3
          - chip: ESP32-C5
            target: esp32c5
          - chip: ESP32-C6
            target: esp32c6
          - chip: ESP32-S3
            target: esp32s3

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Cache native toolchain
        uses: actions/cache@v6
        with:
          path: .github/.cache/native-home
          key: native-${{ runner.os }}-idf-v5.5-${{ matrix.target }}-${{ hashFiles('.github/scripts/build_native_firmware.sh', 'src/cpp/frontend/native/app/dependencies.lock', 'src/cpp/frontend/native/app/sdkconfig*.defaults', 'src/cpp/frontend/native/app/partitions.csv') }}
          restore-keys: |
            native-${{ runner.os }}-idf-v5.5-${{ matrix.target }}-
            native-${{ runner.os }}-idf-v5.5-

      - name: Build native firmware
        run: |
          mkdir -p output
          bash .github/scripts/build_native_firmware.sh
        env:
          NATIVE_TARGET: ${{ matrix.target }}
          NATIVE_OUTPUT: ${{ github.workspace }}/output/espectre-native-snapshot-${{ matrix.target }}.bin
          NATIVE_OTA_OUTPUT: ${{ github.workspace }}/output/espectre-native-snapshot-${{ matrix.target }}-ota.bin
          NATIVE_OTA_SNAPSHOT: 1

      - name: Upload native firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-native-${{ matrix.chip }}
          path: output/espectre-native-*.bin
          retention-days: 1

  release:
    name: Create Snapshot Release
    needs: [build, build-matter, build-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Download all firmware artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          path: firmware
          merge-multiple: true
      
      - name: List firmware files
        run: ls -la firmware/

      - name: Verify firmware matrix and build snapshot manifests
        run: |
          python .github/scripts/build_firmware_manifest.py \
            --firmware-dir firmware \
            --output firmware/firmware-manifest-snapshot.json \
            --channel main \
            --version main \
            --release-tag snapshot \
            --commit "${{ github.event.workflow_run.head_sha }}" \
            --native-ota-manifest-dir firmware \
            --require-complete-matrix

      - name: Delete existing snapshot release
        run: gh release delete snapshot --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
      
      - name: Create snapshot release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: snapshot
          name: Snapshot Build
          body: |
            ⚠️ **This is an automated snapshot build from the main branch.**
            
            Not recommended for production use. For stable releases, use the [latest official release](https://github.com/francescopace/espectre/releases/latest).
            
            **Commit:** ${{ github.event.workflow_run.head_sha }}
            **Date:** ${{ github.event.workflow_run.created_at }}
          files: |
            firmware/*.bin
            firmware/*.json
          draft: false
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pages:
    name: Publish Web Flash Pages
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Documentation
        run: python .github/scripts/build_docs.py

      - name: Build Search Index
        run: npx -y pagefind --site docs/web --output-path docs/web/_pagefind --glob "documentation/**/*.html"

      - name: Download main firmware artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          path: main-firmware
          merge-multiple: true

      - name: Stage main web firmware
        run: |
          python .github/scripts/stage_web_firmware.py \
            --firmware-dir main-firmware \
            --output-dir docs/web/flash/firmware/main \
            --channel main \
            --version main \
            --release-tag snapshot \
            --url-prefix /flash/firmware/main \
            --commit "${{ github.event.workflow_run.head_sha }}"

      - name: Download stable release assets
        run: |
          mkdir -p stable-firmware
          if gh release view >/dev/null 2>&1; then
            STABLE_TAG="$(gh release view --json tagName --jq '.tagName')"
            gh release download "$STABLE_TAG" --pattern '*.bin' --dir stable-firmware --clobber
            echo "stable_tag=$STABLE_TAG" >> "$GITHUB_ENV"
          else
            echo "No stable release found; skipping stable channel staging."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Stage stable web firmware
        run: |
          if ls stable-firmware/*.bin >/dev/null 2>&1; then
            python .github/scripts/stage_web_firmware.py \
              --firmware-dir stable-firmware \
              --output-dir docs/web/flash/firmware/stable \
              --channel stable \
              --version "${stable_tag}" \
              --release-tag "${stable_tag}" \
              --url-prefix /flash/firmware/stable
          else
            echo "No stable firmware downloaded; leaving stable channel empty."
          fi

      - name: Verify Build
        run: |
          test -f docs/web/sitemap.xml
          test -f docs/web/configure/index.html
          test -f docs/web/monitor/index.html
          test -f docs/web/theremin/index.html
          test -d docs/web/documentation
          test -d docs/web/_pagefind
          test -f docs/web/flash/firmware/main/firmware-manifest-main.json
          test "$(find docs/web/flash/firmware/main -maxdepth 1 -type f -name '*.bin' | wc -l | tr -d ' ')" -eq 15
          echo "Web flash Pages build verified!"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/web

  deploy-pages:
    name: Deploy Web Flash Pages
    needs: publish-pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
