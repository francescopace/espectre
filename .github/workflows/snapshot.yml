name: Snapshot

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: snapshot-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  validate-run:
    name: Validate Source Run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'main' ||
       github.event.workflow_run.head_branch == 'develop')
    outputs:
      current: ${{ steps.current.outputs.current }}
    
    steps:
      - name: Verify source commit is still the branch head
        id: current
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const branch = context.payload.workflow_run.head_branch;
            const expected = context.payload.workflow_run.head_sha;
            const response = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch
            });
            const current = response.data.commit.sha === expected;
            core.setOutput("current", current ? "true" : "false");
            core.info(current
              ? `Source commit ${expected} is current on ${branch}.`
              : `Skipping stale source commit ${expected}; ${branch} is now ${response.data.commit.sha}.`);

  release:
    name: Create Snapshot Release
    needs: validate-run
    if: needs.validate-run.outputs.current == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Download all firmware artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: firmware-*
          path: firmware
          merge-multiple: true

      - name: Download SDK package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: sdk-*
          path: sdk
          merge-multiple: true
      
      - name: List firmware files
        run: ls -la firmware/

      - name: List SDK files
        run: ls -la sdk/

      - name: Select snapshot channel
        id: snapshot
        run: |
          if [ "${{ github.event.workflow_run.head_branch }}" = "develop" ]; then
            {
              echo "channel=develop"
              echo "version=develop"
              echo "tag=snapshot-dev"
              echo "title=Snapshot Dev Build"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "channel=main"
              echo "version=main"
              echo "tag=snapshot"
              echo "title=Snapshot Build"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Verify firmware matrix and build snapshot manifests
        run: |
          python .github/scripts/build_firmware_manifest.py \
            --firmware-dir firmware \
            --output firmware/firmware-manifest-${{ steps.snapshot.outputs.tag }}.json \
            --channel "${{ steps.snapshot.outputs.channel }}" \
            --version "${{ steps.snapshot.outputs.version }}" \
            --release-tag "${{ steps.snapshot.outputs.tag }}" \
            --commit "${{ github.event.workflow_run.head_sha }}" \
            --native-ota-manifest-dir firmware \
            --require-complete-matrix

      - name: Recheck source commit before publishing
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const branch = context.payload.workflow_run.head_branch;
            const expected = context.payload.workflow_run.head_sha;
            const response = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch
            });
            if (response.data.commit.sha !== expected) {
              core.setFailed(`Refusing to publish stale commit ${expected}; ${branch} is now ${response.data.commit.sha}.`);
            }

      - name: Move snapshot tag atomically
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        env:
          SNAPSHOT_TAG: ${{ steps.snapshot.outputs.tag }}
        with:
          script: |
            const tag = process.env.SNAPSHOT_TAG;
            const sha = context.payload.workflow_run.head_sha;
            try {
              await github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
                sha,
                force: true
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha
              });
            }
      
      - name: Create snapshot release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          tag_name: ${{ steps.snapshot.outputs.tag }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: ${{ steps.snapshot.outputs.title }}
          body: |
            ⚠️ **This is an automated snapshot build from the `${{ github.event.workflow_run.head_branch }}` branch.**
            
            Not recommended for production use. For stable releases, use the [latest official release](https://github.com/francescopace/espectre/releases/latest).
            
            **Commit:** ${{ github.event.workflow_run.head_sha }}
            **Date:** ${{ github.event.workflow_run.created_at }}
          files: |
            firmware/*
            sdk/*.tar.gz
            sdk/*.zip
            sdk/*.json
            LICENSE
            LICENSING.md
            THIRD_PARTY_NOTICES.md
          draft: false
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pages:
    name: Publish Website
    needs: release
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Download main firmware artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: firmware-*
          path: main-firmware
          merge-multiple: true

      - name: Download main SDK artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: sdk-*
          path: main-sdk
          merge-multiple: true

      - name: Stage main web firmware
        run: |
          python .github/scripts/stage_web_firmware.py \
            --firmware-dir main-firmware \
            --output-dir docs/web/artifacts/firmware/main \
            --channel main \
            --version main \
            --release-tag snapshot \
            --url-prefix /artifacts/firmware/main \
            --commit "${{ github.event.workflow_run.head_sha }}"

      - name: Stage main web SDK
        run: |
          python .github/scripts/stage_web_sdk.py \
            --sdk-dir main-sdk \
            --output-dir docs/web/artifacts/sdk/main \
            --channel main

      - name: Download stable release assets
        run: |
          mkdir -p stable-firmware
          mkdir -p stable-sdk
          if gh release view >/dev/null 2>&1; then
            STABLE_TAG="$(gh release view --json tagName --jq '.tagName')"
            gh release download "$STABLE_TAG" --pattern '*.bin' --pattern '*-sbom.spdx.json' --pattern '*-THIRD_PARTY_NOTICES.txt' --pattern '*-third-party-licenses.zip' --dir stable-firmware --clobber
            gh release download "$STABLE_TAG" --pattern 'espectre-sdk-*' --pattern 'sdk-manifest-*.json' --dir stable-sdk --clobber
            echo "stable_tag=$STABLE_TAG" >> "$GITHUB_ENV"
          else
            echo "No stable release found; skipping stable channel staging."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Stage stable web firmware
        run: |
          if ls stable-firmware/*.bin >/dev/null 2>&1; then
            python .github/scripts/stage_web_firmware.py \
              --firmware-dir stable-firmware \
              --output-dir docs/web/artifacts/firmware/stable \
              --channel stable \
              --version "${stable_tag}" \
              --release-tag "${stable_tag}" \
              --url-prefix /artifacts/firmware/stable
          else
            echo "No stable firmware downloaded; leaving stable channel empty."
          fi

      - name: Stage stable web SDK
        run: |
          if ls stable-sdk/sdk-manifest-*.json >/dev/null 2>&1; then
            python .github/scripts/stage_web_sdk.py \
              --sdk-dir stable-sdk \
              --output-dir docs/web/artifacts/sdk/stable \
              --channel stable
          else
            echo "No stable SDK downloaded; leaving stable SDK channel empty."
          fi

      - name: Build and verify Pages tree
        uses: ./.github/actions/build-pages
        with:
          require-main: "true"
          require-stable: "true"

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/web

  deploy-pages:
    name: Deploy Website
    needs: publish-pages
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Notify IndexNow
        run: python3 .github/scripts/notify_indexnow.py
