name: Snapshot

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  check-changes:
    name: Check Code Changes
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    outputs:
      should_build: ${{ steps.filter.outputs.code }}
    
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      
      - name: Check for code changes
        id: filter
        run: |
          # Check if any code files changed in the last commit
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(src/|examples/[^/]+\.yaml$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Code changes detected, will build snapshot"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "No code changes, skipping snapshot"
          fi

  build:
    name: Build ${{ matrix.chip }} (${{ matrix.algorithm }})
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: ESP32
            config: examples/espectre-esp32.yaml
            algorithm: classic
          - chip: ESP32
            config: examples/espectre-esp32.yaml
            algorithm: ml
          - chip: ESP32-S2
            config: examples/espectre-s2.yaml
            algorithm: classic
          - chip: ESP32-S2
            config: examples/espectre-s2.yaml
            algorithm: ml
          - chip: ESP32-S3
            config: examples/espectre-s3.yaml
            algorithm: classic
          - chip: ESP32-S3
            config: examples/espectre-s3.yaml
            algorithm: ml
          - chip: ESP32-C3
            config: examples/espectre-c3.yaml
            algorithm: classic
          - chip: ESP32-C3
            config: examples/espectre-c3.yaml
            algorithm: ml
          - chip: ESP32-C5
            config: examples/espectre-c5.yaml
            algorithm: classic
          - chip: ESP32-C5
            config: examples/espectre-c5.yaml
            algorithm: ml
          - chip: ESP32-C6
            config: examples/espectre-c6.yaml
            algorithm: classic
          - chip: ESP32-C6
            config: examples/espectre-c6.yaml
            algorithm: ml
    
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      
      - name: Cache ESPHome build toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.esphome/cache
          key: pio-${{ runner.os }}-${{ matrix.chip }}-${{ hashFiles('requirements.txt', 'examples/*.yaml', '.github/actions/qemu-smoke-test/configs/*.yaml') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ matrix.chip }}-
            pio-${{ runner.os }}-
      
      - name: Install ESPHome
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Compile
        run: esphome -s git_ref ${{ github.event.workflow_run.head_sha }} -s detection_algorithm ${{ matrix.algorithm }} compile ${{ matrix.config }}
      
      - name: Rename firmware files
        run: |
          mkdir -p output
          CHIP=$(echo "${{ matrix.chip }}" | tr '[:upper:]' '[:lower:]' | tr -d '-')
          ALGO="${{ matrix.algorithm }}"
          find examples/.esphome/build -name "firmware*.bin" -exec cp {} output/ \;
          if [ "$ALGO" = "ml" ]; then
            mv "output/firmware.factory.bin" "output/espectre-snapshot-${CHIP}-ml.bin"
            mv "output/firmware.ota.bin" "output/espectre-snapshot-${CHIP}-ml-ota.bin"
          else
            mv "output/firmware.factory.bin" "output/espectre-snapshot-${CHIP}.bin"
            mv "output/firmware.ota.bin" "output/espectre-snapshot-${CHIP}-ota.bin"
          fi
      
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.chip }}-${{ matrix.algorithm }}
          path: output/espectre-*.bin
          retention-days: 1

  build-matter:
    name: Build Matter ${{ matrix.chip }}
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: ESP32
            target: esp32
          - chip: ESP32-C3
            target: esp32c3
          - chip: ESP32-C5
            target: esp32c5
          - chip: ESP32-C6
            target: esp32c6
          - chip: ESP32-S3
            target: esp32s3

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Cache Matter toolchain and components
        uses: actions/cache@v6
        with:
          path: |
            .github/.cache/matter-home
            src/cpp/frontend/matter/app/managed_components
          key: matter-${{ runner.os }}-idf-v5.5-${{ matrix.target }}-${{ hashFiles('.github/scripts/build_matter_firmware.sh', 'src/cpp/frontend/matter/app/dependencies.lock', 'src/cpp/frontend/matter/app/main/idf_component.yml', 'src/cpp/frontend/matter/app/sdkconfig*.defaults', 'src/cpp/frontend/matter/app/partitions.csv') }}
          restore-keys: |
            matter-${{ runner.os }}-idf-v5.5-${{ matrix.target }}-
            matter-${{ runner.os }}-idf-v5.5-

      - name: Build Matter firmware
        run: |
          mkdir -p output
          .github/scripts/build_matter_firmware.sh
        env:
          MATTER_TARGET: ${{ matrix.target }}
          MATTER_OUTPUT: ${{ github.workspace }}/output/espectre-matter-snapshot-${{ matrix.target }}.bin
          MATTER_OTA_OUTPUT: ${{ github.workspace }}/output/espectre-matter-snapshot-${{ matrix.target }}-ota.bin
          MATTER_OTA_VERSION: ${{ github.run_number }}
          MATTER_OTA_VERSION_STR: snapshot-${{ github.run_number }}

      - name: Upload Matter firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-matter-${{ matrix.chip }}
          path: output/espectre-matter-*.bin
          retention-days: 1

  build-native:
    name: Build native ${{ matrix.chip }}
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: ESP32
            target: esp32
          - chip: ESP32-C3
            target: esp32c3
          - chip: ESP32-C5
            target: esp32c5
          - chip: ESP32-C6
            target: esp32c6
          - chip: ESP32-S3
            target: esp32s3

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Cache native toolchain
        uses: actions/cache@v6
        with:
          path: .github/.cache/native-home
          key: native-${{ runner.os }}-idf-v5.5-${{ matrix.target }}-${{ hashFiles('.github/scripts/build_native_firmware.sh', 'src/cpp/frontend/native/app/dependencies.lock', 'src/cpp/frontend/native/app/sdkconfig*.defaults', 'src/cpp/frontend/native/app/partitions.csv') }}
          restore-keys: |
            native-${{ runner.os }}-idf-v5.5-${{ matrix.target }}-
            native-${{ runner.os }}-idf-v5.5-

      - name: Build native firmware
        run: |
          mkdir -p output
          bash .github/scripts/build_native_firmware.sh
        env:
          NATIVE_TARGET: ${{ matrix.target }}
          NATIVE_OUTPUT: ${{ github.workspace }}/output/espectre-native-snapshot-${{ matrix.target }}.bin
          NATIVE_OTA_OUTPUT: ${{ github.workspace }}/output/espectre-native-snapshot-${{ matrix.target }}-ota.bin

      - name: Upload native firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-native-${{ matrix.chip }}
          path: output/espectre-native-*.bin
          retention-days: 1

  build-streamer:
    name: Build streamer ${{ matrix.chip }}
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: ESP32
            target: esp32
          - chip: ESP32-C3
            target: esp32c3
          - chip: ESP32-C5
            target: esp32c5
          - chip: ESP32-C6
            target: esp32c6
          - chip: ESP32-S3
            target: esp32s3

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Cache streamer toolchain
        uses: actions/cache@v6
        with:
          path: .github/.cache/streamer-home
          key: streamer-${{ runner.os }}-idf-v5.5-${{ matrix.target }}-${{ hashFiles('.github/scripts/build_streamer_firmware.sh', 'src/cpp/frontend/streamer/app/sdkconfig*.defaults', 'src/cpp/frontend/streamer/app/partitions.csv') }}
          restore-keys: |
            streamer-${{ runner.os }}-idf-v5.5-${{ matrix.target }}-
            streamer-${{ runner.os }}-idf-v5.5-

      - name: Build streamer firmware
        run: |
          mkdir -p output
          bash .github/scripts/build_streamer_firmware.sh
        env:
          STREAMER_TARGET: ${{ matrix.target }}
          STREAMER_OUTPUT: ${{ github.workspace }}/output/espectre-streamer-snapshot-${{ matrix.target }}.bin
          STREAMER_OTA_OUTPUT: ${{ github.workspace }}/output/espectre-streamer-snapshot-${{ matrix.target }}-ota.bin

      - name: Upload streamer firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-streamer-${{ matrix.chip }}
          path: output/espectre-streamer-*.bin
          retention-days: 1

  release:
    name: Create Snapshot Release
    needs: [build, build-matter, build-native, build-streamer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Download all firmware artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          path: firmware
          merge-multiple: true
      
      - name: List firmware files
        run: ls -la firmware/

      - name: Build main firmware manifest
        run: |
          python .github/scripts/build_firmware_manifest.py \
            --firmware-dir firmware \
            --output firmware/firmware-manifest-main.json \
            --channel main \
            --version main \
            --release-tag snapshot \
            --commit "${{ github.event.workflow_run.head_sha }}"

      - name: Build IDF OTA manifests
        run: |
          python .github/scripts/build_idf_ota_manifests.py \
            --firmware-dir firmware \
            --release-tag snapshot \
            --version "main"
      
      - name: Delete existing snapshot release
        run: gh release delete snapshot --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
      
      - name: Create snapshot release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: snapshot
          name: Snapshot Build
          body: |
            ⚠️ **This is an automated snapshot build from the main branch.**
            
            Not recommended for production use. For stable releases, use the [latest official release](https://github.com/francescopace/espectre/releases/latest).
            
            **Commit:** ${{ github.event.workflow_run.head_sha }}
            **Date:** ${{ github.event.workflow_run.created_at }}
          files: |
            firmware/*.bin
            firmware/*.json
            firmware/firmware-manifest-main.json
          draft: false
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
