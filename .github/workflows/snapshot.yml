name: Snapshot

on:
  workflow_call:
    inputs:
      checks_passed:
        description: Whether every prerequisite CI job succeeded
        required: true
        type: boolean
    secrets:
      FIRMWARE_SIGNING_KEY_RSA:
        description: Key used to sign the published firmware catalog
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: snapshot-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-run:
    name: Validate Source Run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    outputs:
      current: ${{ steps.current.outputs.current }}
      run_id: ${{ steps.current.outputs.run_id }}
      head_sha: ${{ steps.current.outputs.head_sha }}
      head_branch: ${{ steps.current.outputs.head_branch }}
      created_at: ${{ steps.current.outputs.created_at }}
      conclusion: ${{ steps.current.outputs.conclusion }}
    permissions:
      contents: read
      actions: read

    steps:
      - name: Resolve and verify the source CI run
        id: current
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CHECKS_PASSED: ${{ inputs.checks_passed }}
        with:
          script: |
            const runId = context.runId;
            const { data: source } = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: runId,
            });
            const branch = source.head_branch;
            const sha = source.head_sha;
            // This run is still in progress: publication follows CI's prerequisite jobs.
            const conclusion = process.env.CHECKS_PASSED === 'true' ? 'success' : 'failure';
            if (source.path !== '.github/workflows/ci.yml' || source.event !== 'push') {
              core.setFailed(`Source run ${runId} must be a CI push run`);
              return;
            }
            if (branch !== 'main' && branch !== 'develop') {
              core.setFailed(`Source run ${runId} branch is ${branch}, expected main or develop`);
              return;
            }
            if (sha !== context.sha || context.ref !== `refs/heads/${branch}`) {
              core.setFailed(`Source run ${runId} does not match the caller's commit and branch`);
              return;
            }

            const response = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch
            });
            const current = response.data.commit.sha === sha;
            core.setOutput('current', current ? 'true' : 'false');
            core.setOutput('run_id', String(runId));
            core.setOutput('head_sha', sha);
            core.setOutput('head_branch', branch);
            core.setOutput('created_at', source.created_at);
            core.setOutput('conclusion', conclusion);
            core.info(current
              ? `Source commit ${sha} is current on ${branch} with conclusion ${conclusion}.`
              : `Skipping stale source commit ${sha}; ${branch} is now ${response.data.commit.sha}.`);

  publish-sdk-staging:
    name: Publish Snapshot SDK to Staging
    needs: validate-run
    if: >
      needs.validate-run.outputs.current == 'true' &&
      needs.validate-run.outputs.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: sdk-registry-staging
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      published: ${{ steps.source.outputs.current }}
    steps:
      # Use the caller's revision; SDK sources come only from the validated CI artifact.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-sdk-packaging
      - name: Download the component built and tested by CI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.validate-run.outputs.run_id }}
          name: registry-component
          path: .cache/registry
      - name: Recheck source commit before publishing
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          SOURCE_BRANCH: ${{ needs.validate-run.outputs.head_branch }}
          SOURCE_SHA: ${{ needs.validate-run.outputs.head_sha }}
        with:
          script: |
            const response = await github.rest.repos.getBranch({
              ...context.repo, branch: process.env.SOURCE_BRANCH,
            });
            const current = response.data.commit.sha === process.env.SOURCE_SHA;
            core.setOutput('current', String(current));
            if (!current) core.info('Skipping the superseded SDK snapshot.');
      - name: Verify source identity and compare any existing staging version
        if: steps.source.outputs.current == 'true'
        id: existing
        env:
          SOURCE_SHA: ${{ needs.validate-run.outputs.head_sha }}
          SNAPSHOT_CHANNEL: ${{ needs.validate-run.outputs.head_branch == 'develop' && 'develop' || 'preview' }}
        run: |
          python .github/scripts/verify_sdk_component.py check \
            --inventory .cache/registry/component-inventory.json \
            --expected-commit "$SOURCE_SHA" --snapshot-channel "$SNAPSHOT_CHANNEL" \
            --registry-url https://components-staging.espressif.com \
            --wait-seconds 0 --allow-missing
      - name: Extract the verified upload tree
        if: steps.source.outputs.current == 'true' && steps.existing.outputs.exists != 'true'
        run: |
          python .github/scripts/verify_sdk_component.py extract \
            --inventory .cache/registry/component-inventory.json \
            --destination .cache/registry/espectre
      - name: Upload snapshot with trusted GitHub identity
        if: steps.source.outputs.current == 'true' && steps.existing.outputs.exists != 'true'
        uses: espressif/upload-components-ci-action@2ce17d73e35473317c1419dbd4f007aacb593040 # v2.2.1
        with:
          components: 'espectre: .cache/registry/espectre'
          namespace: francescopace
          registry_url: https://components-staging.espressif.com
          repository_url: ''
          commit_sha: ''
          skip_pre_release: false
      - name: Wait for processing and compare published contents
        if: steps.source.outputs.current == 'true'
        run: |
          python .github/scripts/verify_sdk_component.py check \
            --inventory .cache/registry/component-inventory.json \
            --registry-url https://components-staging.espressif.com

  verify-sdk-staging:
    needs: publish-sdk-staging
    if: needs.publish-sdk-staging.outputs.published == 'true'
    uses: ./.github/workflows/sdk-component.yml
    with:
      registry_url: https://components-staging.espressif.com

  release:
    name: Create Snapshot Release
    needs: validate-run
    if: >
      needs.validate-run.outputs.current == 'true' &&
      needs.validate-run.outputs.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-run.outputs.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Download all firmware artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.validate-run.outputs.run_id }}
          pattern: firmware-*
          path: firmware
          merge-multiple: true

      - name: Download SDK package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.validate-run.outputs.run_id }}
          pattern: sdk-*
          path: sdk
          merge-multiple: true

      - name: List firmware files
        run: ls -la firmware/

      - name: List SDK files
        run: ls -la sdk/

      - name: Select rolling channel
        id: snapshot
        run: |
          VERSION="$(python3 .github/scripts/detect_git_version.py --from-sdk-dir sdk)"
          if [ "${{ needs.validate-run.outputs.head_branch }}" = "develop" ]; then
            {
              echo "channel=develop"
              echo "version=${VERSION}"
              echo "tag=snapshot-dev"
              echo "title=Development Build"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "channel=preview"
              echo "version=${VERSION}"
              echo "tag=snapshot"
              echo "title=Preview Build"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Set up firmware signing
        uses: ./.github/actions/setup-firmware-signing

      - name: Verify firmware matrix and build rolling manifests
        env:
          FIRMWARE_SIGNING_KEY_RSA: ${{ secrets.FIRMWARE_SIGNING_KEY_RSA }}
        run: |
          python .github/scripts/build_firmware_manifest.py \
            --firmware-dir firmware \
            --output firmware/firmware-manifest-${{ steps.snapshot.outputs.channel }}.json \
            --channel "${{ steps.snapshot.outputs.channel }}" \
            --version "${{ steps.snapshot.outputs.version }}" \
            --release-tag "${{ steps.snapshot.outputs.tag }}" \
            --commit "${{ needs.validate-run.outputs.head_sha }}" \
            --compliance-url-prefix "https://espectre.dev/artifacts/firmware/${{ steps.snapshot.outputs.channel }}" \
            --require-complete-matrix --sign

      - name: Upload signed firmware catalog
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-firmware-catalog
          overwrite: true
          path: firmware/firmware-manifest-*.json
          if-no-files-found: error

      - name: Build firmware compliance bundle
        run: |
          python .github/scripts/build_firmware_compliance_bundle.py \
            --firmware-dir firmware \
            --output-dir firmware \
            --channel "${{ steps.snapshot.outputs.channel }}" \
            --version "${{ steps.snapshot.outputs.version }}"

      - name: Recheck source commit before publishing
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          SNAPSHOT_BRANCH: ${{ needs.validate-run.outputs.head_branch }}
          SNAPSHOT_SHA: ${{ needs.validate-run.outputs.head_sha }}
        with:
          script: |
            const branch = process.env.SNAPSHOT_BRANCH;
            const expected = process.env.SNAPSHOT_SHA;
            const response = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch
            });
            if (response.data.commit.sha !== expected) {
              core.setFailed(`Refusing to publish stale commit ${expected}; ${branch} is now ${response.data.commit.sha}.`);
            }

      - name: Move rolling tag atomically
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          SNAPSHOT_TAG: ${{ steps.snapshot.outputs.tag }}
          SNAPSHOT_SHA: ${{ needs.validate-run.outputs.head_sha }}
        with:
          script: |
            const tag = process.env.SNAPSHOT_TAG;
            const sha = process.env.SNAPSHOT_SHA;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let exists = false;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              exists = true;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (exists) {
              await github.rest.git.updateRef({
                owner,
                repo,
                ref: `tags/${tag}`,
                sha,
                force: true
              });
            } else {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${tag}`,
                sha
              });
            }

      - name: Create rolling release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.snapshot.outputs.tag }}
          target_commitish: ${{ needs.validate-run.outputs.head_sha }}
          name: ${{ steps.snapshot.outputs.title }}
          body: |
            ⚠️ **This is an automated rolling build from the `${{ needs.validate-run.outputs.head_branch }}` branch.**

            Not recommended for production use. For official releases, use the [latest release](https://github.com/francescopace/espectre/releases/latest).

            **Commit:** ${{ needs.validate-run.outputs.head_sha }}
            **Date:** ${{ needs.validate-run.outputs.created_at }}
          files: |
            firmware/*.bin
            firmware/firmware-compliance-*.zip
            firmware/firmware-manifest-*.json
            sdk/*.tar.gz
            sdk/*.zip
            sdk/*.json
          draft: false
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove superseded manifests and unbundled compliance assets
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          SNAPSHOT_TAG: ${{ steps.snapshot.outputs.tag }}
          SNAPSHOT_CHANNEL: ${{ steps.snapshot.outputs.channel }}
        with:
          script: |
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: process.env.SNAPSHOT_TAG
            });
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              per_page: 100
            });
            const legacyNames = new Set(['LICENSE', 'LICENSING.md', 'THIRD_PARTY_NOTICES.md']);
            const uploadedNames = new Set(assets.map(asset => asset.name));
            for (const kind of ['firmware', 'sdk']) {
              if (uploadedNames.has(`${kind}-manifest-${process.env.SNAPSHOT_CHANNEL}.json`)) {
                legacyNames.add(`${kind}-manifest-${process.env.SNAPSHOT_TAG}.json`);
              }
            }
            const legacySuffixes = [
              '-sbom.spdx.json',
              '-THIRD_PARTY_NOTICES.txt',
              '-third-party-licenses.zip'
            ];
            for (const asset of assets) {
              const supersededOtaManifest = uploadedNames.has(`firmware-manifest-${process.env.SNAPSHOT_CHANNEL}.json`) &&
                /^espectre-native-ota-esp32(?:c3|c5|c6|s2|s3)?\.json$/.test(asset.name);
              if (!supersededOtaManifest && !legacyNames.has(asset.name) && !legacySuffixes.some(suffix => asset.name.endsWith(suffix))) {
                continue;
              }
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id
              });
            }

  publish-coverage:
    name: Publish Coverage Badges
    needs: [validate-run, release]
    if: >
      always() &&
      needs.validate-run.result == 'success' &&
      needs.validate-run.outputs.current == 'true' &&
      (needs.validate-run.outputs.conclusion == 'success' ||
       needs.validate-run.outputs.conclusion == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download available coverage badges
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.validate-run.outputs.run_id }}
          pattern: '*-coverage-badge'
          path: coverage-badges
          merge-multiple: true

      - name: Find available coverage badges
        id: badges
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          badges=(coverage-badges/*.json)
          if (( ${#badges[@]} == 0 )); then
            echo "::warning::The source CI run produced no coverage badge artifacts."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'Publishing %s\n' "${badges[@]}"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Select rolling coverage tag
        if: steps.badges.outputs.available == 'true'
        id: coverage
        shell: bash
        run: |
          if [ "${{ needs.validate-run.outputs.head_branch }}" = "develop" ]; then
            echo "tag=snapshot-dev" >> "$GITHUB_OUTPUT"
          else
            echo "tag=snapshot" >> "$GITHUB_OUTPUT"
          fi

      - name: Recheck source commit before publishing coverage
        if: steps.badges.outputs.available == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          SNAPSHOT_BRANCH: ${{ needs.validate-run.outputs.head_branch }}
          SNAPSHOT_SHA: ${{ needs.validate-run.outputs.head_sha }}
        with:
          script: |
            const branch = process.env.SNAPSHOT_BRANCH;
            const expected = process.env.SNAPSHOT_SHA;
            const response = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch
            });
            if (response.data.commit.sha !== expected) {
              core.setFailed(`Refusing to publish stale coverage for ${expected}; ${branch} is now ${response.data.commit.sha}.`);
            }

      - name: Update rolling coverage assets
        if: steps.badges.outputs.available == 'true'
        shell: bash
        env:
          COVERAGE_TAG: ${{ steps.coverage.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$COVERAGE_TAG" >/dev/null 2>&1; then
            echo "::warning::Release $COVERAGE_TAG does not exist yet; coverage badges were not published."
            exit 0
          fi
          gh release upload "$COVERAGE_TAG" coverage-badges/*.json --clobber

  publish-pages:
    name: Publish Website
    needs: [validate-run, release]
    if: needs.validate-run.outputs.head_branch == 'main' && needs.release.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      pages_artifact: github-pages-${{ github.run_attempt }}
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the checked-out Pages revision
        env:
          EXPECTED_SHA: ${{ needs.validate-run.outputs.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up firmware verification
        uses: ./.github/actions/setup-firmware-signing

      - name: Download signed firmware catalog
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-firmware-catalog
          path: preview-firmware

      - name: Download preview firmware artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.validate-run.outputs.run_id }}
          pattern: firmware-*
          path: preview-firmware
          merge-multiple: true

      - name: Download preview SDK artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.validate-run.outputs.run_id }}
          pattern: sdk-*
          path: preview-sdk
          merge-multiple: true

      - name: Stage preview web firmware
        run: |
          python .github/scripts/stage_web_firmware.py --require-signature \
            --firmware-dir preview-firmware \
            --output-dir docs/web/artifacts/firmware/preview \
            --channel preview \
            --version "$(python3 .github/scripts/detect_git_version.py --from-sdk-dir preview-sdk)" \
            --release-tag snapshot \
            --url-prefix /artifacts/firmware/preview \
            --commit "${{ needs.validate-run.outputs.head_sha }}"

      - name: Stage preview web SDK
        run: |
          python .github/scripts/stage_web_sdk.py \
            --sdk-dir preview-sdk \
            --output-dir docs/web/artifacts/sdk/preview \
            --channel preview

      - name: Stage published release channel
        id: release-assets
        uses: ./.github/actions/stage-published-web-channel
        with:
          release-tag: latest
          channel: release
          firmware-output-dir: docs/web/artifacts/firmware/release
          sdk-output-dir: docs/web/artifacts/sdk/release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Stage published develop channel
        id: develop-assets
        uses: ./.github/actions/stage-published-web-channel
        with:
          release-tag: snapshot-dev
          channel: develop
          firmware-output-dir: docs/web/artifacts/firmware/develop
          sdk-output-dir: docs/web/artifacts/sdk/develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Build and verify Pages tree
        uses: ./.github/actions/build-pages
        with:
          require-preview: "true"
          require-release: ${{ steps.release-assets.outputs.staged }}
          require-develop: ${{ steps.develop-assets.outputs.staged }}

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: docs/web

      - name: Upload deployed sitemap inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: website-sitemap
          overwrite: true
          path: docs/web/sitemap.xml
          if-no-files-found: error
          retention-days: 1

  deploy-pages:
    name: Deploy Website
    needs: [validate-run, publish-pages]
    if: needs.validate-run.outputs.head_branch == 'main' && needs.publish-pages.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          artifact_name: ${{ needs.publish-pages.outputs.pages_artifact }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-run.outputs.head_sha }}

      - name: Download deployed sitemap inventory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: website-sitemap
          path: deployed-website

      - name: Notify IndexNow
        run: python3 .github/scripts/notify_indexnow.py --sitemap deployed-website/sitemap.xml
