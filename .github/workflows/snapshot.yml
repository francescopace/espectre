name: Snapshot

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, develop]

permissions:
  contents: read

jobs:
  check-changes:
    name: Check Code Changes
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'main' ||
       github.event.workflow_run.head_branch == 'develop')
    outputs:
      should_build: ${{ steps.filter.outputs.code }}
    
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      
      - name: Check for code changes
        id: filter
        run: |
          # Check if any code files changed in the last commit.
          # The ESPHome examples live under src/, so ^src/ already covers them.
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(src/|\.github/workflows/(ci|snapshot|release)\.yml$|\.github/scripts/build_[^/]+_firmware\.sh$|\.github/scripts/build_firmware_manifest\.py$|\.github/scripts/build_sdk_package\.py$|\.github/scripts/stage_web_sdk\.py$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Code changes detected, will build snapshot"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "No code changes, skipping snapshot"
          fi

  release:
    name: Create Snapshot Release
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Download all firmware artifacts
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: firmware-*
          path: firmware
          merge-multiple: true

      - name: Download SDK package artifacts
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: sdk-*
          path: sdk
          merge-multiple: true
      
      - name: List firmware files
        run: ls -la firmware/

      - name: List SDK files
        run: ls -la sdk/

      - name: Select snapshot channel
        id: snapshot
        run: |
          if [ "${{ github.event.workflow_run.head_branch }}" = "develop" ]; then
            echo "channel=develop" >> "$GITHUB_OUTPUT"
            echo "version=develop" >> "$GITHUB_OUTPUT"
            echo "tag=snapshot-dev" >> "$GITHUB_OUTPUT"
            echo "title=Snapshot Dev Build" >> "$GITHUB_OUTPUT"
          else
            echo "channel=main" >> "$GITHUB_OUTPUT"
            echo "version=main" >> "$GITHUB_OUTPUT"
            echo "tag=snapshot" >> "$GITHUB_OUTPUT"
            echo "title=Snapshot Build" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify firmware matrix and build snapshot manifests
        run: |
          python .github/scripts/build_firmware_manifest.py \
            --firmware-dir firmware \
            --output firmware/firmware-manifest-${{ steps.snapshot.outputs.tag }}.json \
            --channel "${{ steps.snapshot.outputs.channel }}" \
            --version "${{ steps.snapshot.outputs.version }}" \
            --release-tag "${{ steps.snapshot.outputs.tag }}" \
            --commit "${{ github.event.workflow_run.head_sha }}" \
            --native-ota-manifest-dir firmware \
            --require-complete-matrix

      - name: Delete existing snapshot release
        run: gh release delete "${{ steps.snapshot.outputs.tag }}" --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
      
      - name: Create snapshot release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.snapshot.outputs.tag }}
          name: ${{ steps.snapshot.outputs.title }}
          body: |
            ⚠️ **This is an automated snapshot build from the `${{ github.event.workflow_run.head_branch }}` branch.**
            
            Not recommended for production use. For stable releases, use the [latest official release](https://github.com/francescopace/espectre/releases/latest).
            
            **Commit:** ${{ github.event.workflow_run.head_sha }}
            **Date:** ${{ github.event.workflow_run.created_at }}
          files: |
            firmware/*.bin
            firmware/*.json
            sdk/*.tar.gz
            sdk/*.zip
            sdk/*.json
          draft: false
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pages:
    name: Publish Website
    needs: release
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download main firmware artifacts
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: firmware-*
          path: main-firmware
          merge-multiple: true

      - name: Download main SDK artifacts
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: sdk-*
          path: main-sdk
          merge-multiple: true

      - name: Stage main web firmware
        run: |
          python .github/scripts/stage_web_firmware.py \
            --firmware-dir main-firmware \
            --output-dir docs/web/artifacts/firmware/main \
            --channel main \
            --version main \
            --release-tag snapshot \
            --url-prefix /artifacts/firmware/main \
            --commit "${{ github.event.workflow_run.head_sha }}"

      - name: Stage main web SDK
        run: |
          python .github/scripts/stage_web_sdk.py \
            --sdk-dir main-sdk \
            --output-dir docs/web/artifacts/sdk/main \
            --channel main

      - name: Download stable release assets
        run: |
          mkdir -p stable-firmware
          mkdir -p stable-sdk
          if gh release view >/dev/null 2>&1; then
            STABLE_TAG="$(gh release view --json tagName --jq '.tagName')"
            gh release download "$STABLE_TAG" --pattern '*.bin' --dir stable-firmware --clobber
            gh release download "$STABLE_TAG" --pattern 'espectre-sdk-*' --pattern 'sdk-manifest-*.json' --dir stable-sdk --clobber
            echo "stable_tag=$STABLE_TAG" >> "$GITHUB_ENV"
          else
            echo "No stable release found; skipping stable channel staging."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Stage stable web firmware
        run: |
          if ls stable-firmware/*.bin >/dev/null 2>&1; then
            python .github/scripts/stage_web_firmware.py \
              --firmware-dir stable-firmware \
              --output-dir docs/web/artifacts/firmware/stable \
              --channel stable \
              --version "${stable_tag}" \
              --release-tag "${stable_tag}" \
              --url-prefix /artifacts/firmware/stable
          else
            echo "No stable firmware downloaded; leaving stable channel empty."
          fi

      - name: Stage stable web SDK
        run: |
          if ls stable-sdk/sdk-manifest-*.json >/dev/null 2>&1; then
            python .github/scripts/stage_web_sdk.py \
              --sdk-dir stable-sdk \
              --output-dir docs/web/artifacts/sdk/stable \
              --channel stable
          else
            echo "No stable SDK downloaded; leaving stable SDK channel empty."
          fi

      - name: Stage Browser Dependencies
        run: |
          npm --prefix docs/web ci --ignore-scripts
          npm --prefix docs/web run stage:vendor

      - name: Build Static Pages
        run: python3 .github/scripts/build_static_pages.py

      - name: Verify Build
        run: |
          test -f docs/web/sitemap.xml
          test -f docs/web/index.html
          test -f docs/web/assets/js/app.js
          test -f docs/web/assets/css/styles.css
          test -f docs/web/assets/js/espectre-ble.js
          test -f docs/web/vendor/qrcodejs-1.0.0/qrcode.min.js
          test -f docs/web/vendor/esp-web-tools-10.4.0/install-button.js
          test -f docs/web/vendor/mqtt-5.3.0/mqtt.min.js
          test -f docs/web/privacy/index.html
          for route in flash configure monitor theremin game guides \
              guide-hardware guide-setup guide-detection guide-firmware \
              docs docs-api docs-examples docs-architecture media roadmap; do
            grep -q "data-page=\"$route\"" docs/web/index.html \
              || { echo "Missing SPA route: $route"; exit 1; }
          done
          # Retired URLs fall through to this catch-all, served by Pages on 404.
          test -f docs/web/404.html \
            || { echo "Missing 404.html catch-all"; exit 1; }
          # Canonical content pages are generated; the sitemap is committed.
          for guide in hardware setup detection custom-firmware; do
            test -f "docs/web/guides/$guide/index.html" \
              || { echo "Missing generated guide page: $guide"; exit 1; }
          done
          test -f docs/web/media/index.html \
            || { echo "Missing generated media page"; exit 1; }
          test -f docs/web/roadmap/index.html \
            || { echo "Missing generated roadmap page"; exit 1; }
          test -f docs/web/artifacts/firmware/main/firmware-manifest-main.json
          test "$(find docs/web/artifacts/firmware/main -maxdepth 1 -type f -name '*.bin' | wc -l | tr -d ' ')" -eq 15
          test -f docs/web/artifacts/sdk/main/index.html
          test -f docs/web/artifacts/sdk/main/sdk-manifest-main.json
          test -f docs/web/artifacts/sdk/stable/index.html
          test -f docs/web/artifacts/sdk/stable/sdk-manifest-stable.json
          echo "Website build verified!"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/web

  deploy-pages:
    name: Deploy Website
    needs: publish-pages
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
