name: Code Analysis

on:
  # Code reaches main only from develop, so main is checked by the weekly run.
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  schedule:
    - cron: '0 2 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-analysis-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: none
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  python:
    name: Python quality (informational)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - name: Install pinned Ruff
        run: python -m pip install "$(sed -n '/^ruff==/s/ .*//p' requirements.txt)"
      - name: Run Ruff
        continue-on-error: true
        run: |
          mkdir -p .cache/reports/quality
          ruff check src/python tools test/python .github/scripts --output-format sarif --output-file .cache/reports/quality/ruff.sarif
      - name: Summarize Python quality
        if: always()
        run: python .github/scripts/summarize_quality.py --name Ruff --report .cache/reports/quality/ruff.sarif
      - name: Upload Python quality alerts
        if: always() && hashFiles('.cache/reports/quality/ruff.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: .cache/reports/quality/ruff.sarif
          category: quality/python

  javascript:
    name: JavaScript quality (informational)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .github/quality/package-lock.json
      - name: Install lint dependencies
        run: npm --prefix .github/quality ci --ignore-scripts
      - name: Run ESLint
        continue-on-error: true
        env:
          # GitHub code scanning does not honor SARIF in-source suppressions.
          SARIF_ESLINT_IGNORE_SUPPRESSED: 'true'
        run: |
          mkdir -p .cache/reports/quality
          .github/quality/node_modules/.bin/eslint --config .github/quality/eslint.config.mjs docs/web/assets/js docs/web/*.mjs docs/web/headless-entry.js .github/quality/*.mjs --format ./.github/quality/node_modules/@microsoft/eslint-formatter-sarif/sarif.js --output-file .cache/reports/quality/eslint.sarif
      - name: Summarize JavaScript quality
        if: always()
        run: python .github/scripts/summarize_quality.py --name ESLint --report .cache/reports/quality/eslint.sarif
      - name: Upload JavaScript quality alerts
        if: always() && hashFiles('.cache/reports/quality/eslint.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: .cache/reports/quality/eslint.sarif
          category: quality/javascript

  cpp:
    name: C/C++ quality (informational)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - name: Install pinned Cppcheck
        run: python -m pip install "$(sed -n '/^cppcheck==/s/ .*//p' requirements.txt)"
      - name: Run Cppcheck
        continue-on-error: true
        run: |
          mkdir -p .cache/reports/quality
          rm -f .cache/reports/quality/cppcheck.sarif .cache/reports/quality/cppcheck.raw.sarif
          # Scan tracked first-party translation units and their included headers.
          # SDK-dependent paths are checked without a firmware build configuration;
          # the host mock supplies the ESP-IDF version macros used in #if guards.
          git ls-files 'src/cpp/*.c' 'src/cpp/*.cpp' \
            'test/cpp/*.c' 'test/cpp/*.cpp' \
            ':!:src/cpp/**/third_party/**' ':!:test/cpp/support/cnpy.cpp' \
            > .cache/reports/quality/cppcheck-files.txt
          cppcheck --enable=warning,style,performance,portability \
            --std=c++17 --platform=unix32 --check-level=normal --inline-suppr \
            -Isrc/cpp --include=test/cpp/mocks/esp_idf/esp_idf_version.h \
            --file-list=.cache/reports/quality/cppcheck-files.txt \
            --output-format=sarif --output-file=.cache/reports/quality/cppcheck.raw.sarif
          python .github/scripts/normalize_cppcheck_sarif.py \
            --report .cache/reports/quality/cppcheck.raw.sarif \
            --output .cache/reports/quality/cppcheck.sarif \
            --config .github/quality/cppcheck.json
      - name: Summarize C/C++ quality
        if: always()
        run: python .github/scripts/summarize_quality.py --name Cppcheck --report .cache/reports/quality/cppcheck.sarif
      - name: Preserve C/C++ quality reports
        if: always() && hashFiles('.cache/reports/quality/cppcheck.raw.sarif') != ''
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cppcheck-reports
          path: .cache/reports/quality/cppcheck*.sarif
          include-hidden-files: true
          retention-days: 14
      - name: Upload C/C++ quality alerts
        if: always() && hashFiles('.cache/reports/quality/cppcheck.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: .cache/reports/quality/cppcheck.sarif
          category: quality/cpp
