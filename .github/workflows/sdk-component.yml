name: SDK Component Builds

on:
  workflow_call:
    inputs:
      registry_url:
        description: Registry to test; empty builds the unpacked artifact with a local override
        type: string
        default: ''
      source_run_id:
        description: Source CI run; empty uses artifacts from the current run
        type: string
        default: ''
      publication:
        description: CI publication channel to pass to the final dispatch
        type: string
        default: ''
    outputs:
      publication:
        description: Publication channel from the verified SDK package
        value: ${{ jobs.verify.outputs.publication }}

permissions:
  contents: read
  actions: read

jobs:
  # Builds the packaged SDK as an outside consumer would. Firmware builds already
  # compile these sources on every target, so this matrix covers what only the
  # package exercises: each optional service alone, the manifest dependency
  # rules, one target per architecture, and the oldest and newest ESP-IDF.
  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      publication: ${{ inputs.publication }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Core ESP32, target: esp32, profile: minimal}
          - {name: Core ESP32-C5, target: esp32c5, profile: minimal}
          - {name: Frontend ESP32-C3, target: esp32c3, profile: frontend_support}
          - {name: MQTT ESP32-C3, target: esp32c3, profile: mqtt}
          - {name: Provisioning ESP32-C3, target: esp32c3, profile: provisioning}
          - {name: Direct HTTP ESP32-C3, target: esp32c3, profile: direct}
          - {name: Full ESP32-C3, target: esp32c3, profile: all}
          - {name: Full ESP32-C5 IDF 5.5.3, target: esp32c5, profile: all, idf: '5.5.3'}
          - {name: Full ESP32-C6 IDF 6.1, target: esp32c6, profile: all, idf: '6.1'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-sdk-packaging
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run_id || github.run_id }}
          name: registry-component
          path: .cache/registry
      - name: Prepare isolated consumer
        env:
          REGISTRY_URL: ${{ inputs.registry_url }}
          SDK_TARGET: ${{ matrix.target }}
          SDK_PROFILE: ${{ matrix.profile }}
        run: |
          python .github/scripts/verify_sdk_component.py prepare \
            --inventory .cache/registry/component-inventory.json \
            --destination "$RUNNER_TEMP/sdk-consumer" \
            --target "$SDK_TARGET" --profile "$SDK_PROFILE" \
            --registry-url "$REGISTRY_URL" --package-example
      - name: Build with ESP-IDF ${{ matrix.idf || 'release toolchain' }} and verify installation
        env:
          REGISTRY_URL: ${{ inputs.registry_url }}
          SDK_TARGET: ${{ matrix.target }}
          SDK_IDF: ${{ matrix.idf }}
        run: |
          python .github/scripts/verify_sdk_component.py build --docker \
            --inventory .cache/registry/component-inventory.json \
            --destination "$RUNNER_TEMP/sdk-consumer" \
            --target "$SDK_TARGET" --registry-url "$REGISTRY_URL" \
            ${SDK_IDF:+--idf-version "$SDK_IDF"} \
            > "$RUNNER_TEMP/sdk-build.log" 2>&1 \
            || { tail -n 100 "$RUNNER_TEMP/sdk-build.log"; exit 1; }
          tail -n 5 "$RUNNER_TEMP/sdk-build.log"
      - name: Retain build diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: registry-build-${{ inputs.registry_url != '' && 'registry' || 'local' }}-${{ matrix.target }}-${{ matrix.profile }}-${{ matrix.idf || 'release' }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk-build.log
          retention-days: 7
