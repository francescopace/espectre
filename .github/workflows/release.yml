name: Release

on:
  workflow_call:
    inputs:
      checks_passed:
        description: Whether every prerequisite CI job succeeded
        required: true
        type: boolean
    secrets:
      FIRMWARE_SIGNING_KEY_RSA:
        description: Key used to sign the published firmware catalog
        required: true
  workflow_dispatch:
    inputs:
      pages_run_id:
        description: Tag CI run containing the verified release website to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate Release Source
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read

    steps:
      - name: Verify the caller and completed CI checks
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CHECKS_PASSED: ${{ inputs.checks_passed }}
        with:
          script: |
            if (process.env.CHECKS_PASSED !== 'true' || !context.ref.startsWith('refs/tags/')) {
              throw new Error('Release publication requires a tag and successful CI checks.');
            }
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: context.runId,
            });
            if (run.path !== '.github/workflows/ci.yml' || run.event !== 'push' ||
                run.head_sha !== context.sha) {
              throw new Error('Release artifacts must come from the calling CI push run.');
            }
            core.info(`Publishing the artifacts validated by CI run ${run.id}.`);

  publish-sdk-staging:
    name: Publish SDK to Staging
    needs: validate-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: sdk-registry-staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-sdk-packaging
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: registry-component
          path: .cache/registry
      - name: Compare any existing staging version
        id: existing
        run: |
          python .github/scripts/verify_sdk_component.py check \
            --inventory .cache/registry/component-inventory.json \
            --registry-url https://components-staging.espressif.com \
            --wait-seconds 0 --allow-missing
      - name: Extract the verified upload tree
        if: steps.existing.outputs.exists != 'true'
        run: |
          python .github/scripts/verify_sdk_component.py extract \
            --inventory .cache/registry/component-inventory.json \
            --destination .cache/registry/espectre
      - name: Upload with trusted GitHub identity
        if: steps.existing.outputs.exists != 'true'
        uses: espressif/upload-components-ci-action@2ce17d73e35473317c1419dbd4f007aacb593040 # v2.2.1
        with:
          components: 'espectre: .cache/registry/espectre'
          namespace: francescopace
          registry_url: https://components-staging.espressif.com
          # Preserve the source provenance already stamped in the artifact.
          repository_url: ''
          commit_sha: ''
          skip_pre_release: false
      - name: Wait for processing and compare published contents
        run: |
          python .github/scripts/verify_sdk_component.py check \
            --inventory .cache/registry/component-inventory.json \
            --registry-url https://components-staging.espressif.com

  verify-sdk-staging:
    needs: publish-sdk-staging
    uses: ./.github/workflows/sdk-component.yml
    with:
      registry_url: https://components-staging.espressif.com

  publish-sdk-production:
    name: Publish Stable SDK to Registry
    needs: [release, verify-sdk-staging]
    if: github.event_name == 'push' && !contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: sdk-registry-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-sdk-packaging
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: registry-component
          path: .cache/registry
      - name: Compare any existing public version
        id: existing
        run: |
          python .github/scripts/verify_sdk_component.py check \
            --inventory .cache/registry/component-inventory.json \
            --registry-url https://components.espressif.com \
            --wait-seconds 0 --allow-missing
      - name: Extract the staging-verified upload tree
        if: steps.existing.outputs.exists != 'true'
        run: |
          python .github/scripts/verify_sdk_component.py extract \
            --inventory .cache/registry/component-inventory.json \
            --destination .cache/registry/espectre
      - name: Upload stable version with trusted GitHub identity
        if: steps.existing.outputs.exists != 'true'
        uses: espressif/upload-components-ci-action@2ce17d73e35473317c1419dbd4f007aacb593040 # v2.2.1
        with:
          components: 'espectre: .cache/registry/espectre'
          namespace: francescopace
          registry_url: https://components.espressif.com
          repository_url: ''
          commit_sha: ''
          skip_pre_release: true
      - name: Download the public component and standalone example
        run: |
          python .github/scripts/verify_sdk_component.py prepare \
            --inventory .cache/registry/component-inventory.json \
            --registry-url https://components.espressif.com \
            --destination "$RUNNER_TEMP/sdk-public" --target esp32c3 --profile all
      - name: Verify public installation and build
        run: |
          python .github/scripts/verify_sdk_component.py build --docker \
            --inventory .cache/registry/component-inventory.json \
            --registry-url https://components.espressif.com \
            --destination "$RUNNER_TEMP/sdk-public" --target esp32c3 \
            > "$RUNNER_TEMP/sdk-public-build.log" 2>&1 \
            || { tail -n 100 "$RUNNER_TEMP/sdk-public-build.log"; exit 1; }
          tail -n 5 "$RUNNER_TEMP/sdk-public-build.log"

  release:
    name: Create Release
    needs: [validate-release, verify-sdk-staging]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      discussions: write
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Download all firmware artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: firmware-*
          path: firmware
          merge-multiple: true

      - name: Download SDK package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: sdk-*
          path: sdk
          merge-multiple: true

      - name: Download registry package and checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: registry-component
          path: registry
      
      - name: List firmware files
        run: ls -la firmware/

      - name: List SDK files
        run: ls -la sdk/

      - name: Set up firmware signing
        uses: ./.github/actions/setup-firmware-signing

      - name: Verify firmware matrix and build release manifests
        env:
          FIRMWARE_SIGNING_KEY_RSA: ${{ secrets.FIRMWARE_SIGNING_KEY_RSA }}
        run: |
          python .github/scripts/build_firmware_manifest.py \
            --firmware-dir firmware \
            --output firmware/firmware-manifest-release.json \
            --channel release \
            --version "${GITHUB_REF_NAME}" \
            --release-tag "${GITHUB_REF_NAME}" \
            --commit "${GITHUB_SHA}" \
            --compliance-url-prefix "https://espectre.dev/artifacts/firmware/release" \
            --require-complete-matrix --sign

      - name: Upload signed firmware catalog
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-firmware-catalog
          overwrite: true
          path: firmware/firmware-manifest-*.json
          if-no-files-found: error

      - name: Build firmware compliance bundle
        run: |
          python .github/scripts/build_firmware_compliance_bundle.py \
            --firmware-dir firmware \
            --output-dir firmware \
            --channel release \
            --version "${GITHUB_REF_NAME}"

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME}"
          
          # Extract section for this version from CHANGELOG.md
          # Matches from "## [version]" until the next "## [" or end of file
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ { 
              if (found) exit
              if (index($0, "[" ver "]")) found=1
            }
            found { print }
          ' docs/CHANGELOG.md)
          
          # Extract title from first line
          # Format: "## [2.5.0] - 2026-02-08 - Title Here" or "## [2.5.0] - in progress - Title Here"
          FIRST_LINE=$(echo "$NOTES" | head -1)
          
          # Split by " - " and get the third part (title)
          # ## [2.5.0] - in progress - Title  →  parts: "[2.5.0]", "in progress", "Title"
          TITLE=$(echo "$FIRST_LINE" | awk -F ' - ' '{print $3}')
          
          # Clean up title
          TITLE=$(echo "$TITLE" | xargs)  # Trim whitespace
          
          # If no title, use generic
          if [ -z "$TITLE" ]; then
            TITLE="Release"
          fi
          
          # If no specific version found, use generic message
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG.md](https://github.com/francescopace/espectre/blob/main/docs/CHANGELOG.md) for details."
            TITLE="Release"
          else
            # Remove first line (header) from body - it's already in the release title
            NOTES=$(echo "$NOTES" | tail -n +2)
          fi
          
          # Save to file for the release action
          echo "$NOTES" > release_notes.md
          
          # Save title for release name
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          
          echo "=== Release: v${VERSION} - ${TITLE} ==="
          cat release_notes.md
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "v${{ github.ref_name }} - ${{ steps.changelog.outputs.title }}"
          body_path: release_notes.md
          files: |
            firmware/*.bin
            firmware/firmware-compliance-*.zip
            firmware/firmware-manifest-*.json
            sdk/*.tar.gz
            sdk/*.zip
            sdk/*.json
            registry/*.tgz
            registry/component-inventory.json
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          discussion_category_name: "Announcements"
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove superseded unbundled compliance assets
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: context.ref.replace('refs/tags/', '')
            });
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              per_page: 100
            });
            const legacyNames = new Set(['LICENSE', 'LICENSING.md', 'THIRD_PARTY_NOTICES.md']);
            const uploadedNames = new Set(assets.map(asset => asset.name));
            if (uploadedNames.has('firmware-manifest-release.json')) {
              legacyNames.add(`firmware-manifest-${context.ref.replace('refs/tags/', '')}.json`);
            }
            const legacySuffixes = [
              '-sbom.spdx.json',
              '-THIRD_PARTY_NOTICES.txt',
              '-third-party-licenses.zip'
            ];
            for (const asset of assets) {
              const supersededOtaManifest = uploadedNames.has('firmware-manifest-release.json') &&
                /^espectre-native-ota-esp32(?:c3|c5|c6|s2|s3)?\.json$/.test(asset.name);
              if (!supersededOtaManifest && !legacyNames.has(asset.name) && !legacySuffixes.some(suffix => asset.name.endsWith(suffix))) {
                continue;
              }
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id
              });
            }

  publish-pages:
    name: Publish Website
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up firmware verification
        uses: ./.github/actions/setup-firmware-signing

      - name: Download signed firmware catalog
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-firmware-catalog
          path: release-firmware

      - name: Download release firmware artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: firmware-*
          path: release-firmware
          merge-multiple: true

      - name: Download release SDK artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: sdk-*
          path: release-sdk
          merge-multiple: true

      - name: Stage release web firmware
        run: |
          python .github/scripts/stage_web_firmware.py --require-signature \
            --firmware-dir release-firmware \
            --output-dir docs/web/artifacts/firmware/release \
            --channel release \
            --version "${GITHUB_REF_NAME}" \
            --release-tag "${GITHUB_REF_NAME}" \
            --url-prefix /artifacts/firmware/release

      - name: Stage release web SDK
        run: |
          python .github/scripts/stage_web_sdk.py \
            --sdk-dir release-sdk \
            --output-dir docs/web/artifacts/sdk/release \
            --channel release

      - name: Stage published preview channel
        id: preview-assets
        uses: ./.github/actions/stage-published-web-channel
        with:
          release-tag: snapshot
          channel: preview
          firmware-output-dir: docs/web/artifacts/firmware/preview
          sdk-output-dir: docs/web/artifacts/sdk/preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Stage published develop channel
        id: develop-assets
        uses: ./.github/actions/stage-published-web-channel
        with:
          release-tag: snapshot-dev
          channel: develop
          firmware-output-dir: docs/web/artifacts/firmware/develop
          sdk-output-dir: docs/web/artifacts/sdk/develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Build and verify Pages tree
        uses: ./.github/actions/build-pages
        with:
          require-preview: ${{ steps.preview-assets.outputs.staged }}
          require-release: "true"
          require-develop: ${{ steps.develop-assets.outputs.staged }}

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: docs/web

      - name: Upload deployed sitemap inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: website-sitemap
          overwrite: true
          path: docs/web/sitemap.xml
          if-no-files-found: error
          retention-days: 1

  dispatch-pages:
    name: Dispatch Website Deployment
    needs: publish-pages
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: write

    steps:
      - name: Deploy through a branch dispatch and wait for its result
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            // A tag-triggered Pages deployment can silently retain an earlier
            // artifact for the same SHA. A fresh branch dispatch avoids that path.
            const response = await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'release.yml',
              ref: 'main',
              inputs: {
                pages_run_id: String(context.runId),
              },
              headers: { 'X-GitHub-Api-Version': '2026-03-10' },
            });
            const runId = response.data.workflow_run_id;
            if (!Number.isSafeInteger(runId)) {
              throw new Error('The Pages dispatch did not return a workflow run ID.');
            }
            core.info(`Website deployment: ${response.data.html_url}`);
            const deadline = Date.now() + 23 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data: run } = await github.rest.actions.getWorkflowRun({
                ...context.repo, run_id: runId,
              });
              if (run.status === 'completed') {
                if (run.conclusion !== 'success') {
                  throw new Error(`Website deployment ${runId}: ${run.conclusion}. See ${run.html_url}`);
                }
                core.info('Website deployment and live catalog verification succeeded.');
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error(`Timed out waiting for website deployment ${runId}.`);

  deploy-pages:
    name: Deploy Website
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Validate the source release artifact
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            if (context.ref !== 'refs/heads/main') {
              throw new Error('Website deployment must be dispatched on main.');
            }
            const runId = Number(context.payload.inputs.pages_run_id);
            if (!Number.isSafeInteger(runId) || runId <= 0) {
              throw new Error('Source run ID must be a positive integer.');
            }
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: runId,
            });
            const { data: workflow } = await github.rest.actions.getWorkflow({
              ...context.repo, workflow_id: 'ci.yml',
            });
            if (run.workflow_id !== workflow.id || run.event !== 'push' ||
                run.head_repository?.full_name !== context.payload.repository.full_name) {
              throw new Error('The source must be a CI push run in this repository.');
            }
            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              ...context.repo, basehead: `main...${run.head_sha}`,
            });
            if (!['behind', 'identical'].includes(comparison.status)) {
              throw new Error('The source release commit must be reachable from main.');
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id: runId, filter: 'all', per_page: 100,
            });
            for (const name of ['Validate Release Source', 'Create Release', 'Publish Website']) {
              // A retry of only failed jobs reuses successful jobs from earlier attempts.
              const latest = jobs.filter(job => job.name === `Publish Release / ${name}`)
                .sort((left, right) => right.run_attempt - left.run_attempt)[0];
              if (latest?.conclusion !== 'success') {
                throw new Error(`Source release job has not succeeded: ${name}`);
              }
              if (name === 'Publish Website') {
                core.setOutput('pages_artifact', `github-pages-${latest.run_attempt}`);
              }
            }
            core.setOutput('run_id', String(runId));
            core.info(`Reusing the verified website from ${run.html_url}.`);

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the verified Pages archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.source.outputs.run_id }}
          name: ${{ steps.source.outputs.pages_artifact }}
          path: source-pages

      - name: Upload the same Pages archive for this dispatch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: github-pages
          overwrite: true
          path: source-pages/artifact.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      - name: Verify the published catalogs and signing keys
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 .github/scripts/verify_web_deployment.py \
            --archive source-pages/artifact.tar \
            --base-url "${PAGE_URL}" \
            --path artifacts/firmware/release/firmware-manifest-release.json \
            --path artifacts/sdk/release/sdk-manifest-release.json \
            --path assets/firmware-signing-keys.json

      - name: Download deployed sitemap inventory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.source.outputs.run_id }}
          name: website-sitemap
          path: deployed-website

      - name: Notify IndexNow
        run: python3 .github/scripts/notify_indexnow.py --sitemap deployed-website/sitemap.xml
