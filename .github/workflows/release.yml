name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'      # Match: 2.5.0, 1.0.0, etc.
      - '[0-9]+.[0-9]+.[0-9]+-*'    # Match: 2.5.0-rc1, 2.5.0-beta, etc.

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.chip }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: ESP32
            config: examples/espectre-esp32.yaml
          - chip: ESP32-S3
            config: examples/espectre-s3.yaml
          - chip: ESP32-C3
            config: examples/espectre-c3.yaml
          - chip: ESP32-C5
            config: examples/espectre-c5.yaml
          - chip: ESP32-C6
            config: examples/espectre-c6.yaml
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      
      - name: Cache ESPHome build toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.esphome/cache
          key: pio-${{ runner.os }}-${{ matrix.chip }}-${{ hashFiles('requirements.txt', 'examples/*.yaml', '.github/actions/qemu-smoke-test/configs/*.yaml') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ matrix.chip }}-
            pio-${{ runner.os }}-
      
      - name: Install ESPHome
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Compile
        run: esphome -s git_ref ${{ github.ref_name }} -s detection_algorithm classic compile ${{ matrix.config }}
      
      - name: Rename firmware files
        run: |
          mkdir -p output
          VERSION="${GITHUB_REF_NAME}"
          CHIP=$(echo "${{ matrix.chip }}" | tr '[:upper:]' '[:lower:]' | tr -d '-')
          find examples/.esphome/build -name "firmware*.bin" -exec cp {} output/ \;
          mv "output/firmware.factory.bin" "output/espectre-${VERSION}-${CHIP}.bin"
          mv "output/firmware.ota.bin" "output/espectre-${VERSION}-${CHIP}-ota.bin"
      
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.chip }}
          path: output/espectre-${{ github.ref_name }}-*.bin
          retention-days: 7

  build-matter:
    name: Build Matter ${{ matrix.chip }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: ESP32
            target: esp32
          - chip: ESP32-C3
            target: esp32c3
          - chip: ESP32-C5
            target: esp32c5
          - chip: ESP32-C6
            target: esp32c6
          - chip: ESP32-S3
            target: esp32s3

    steps:
      - uses: actions/checkout@v7

      - name: Cache Matter toolchain and components
        uses: actions/cache@v6
        with:
          path: |
            .github/.cache/matter-home
            src/cpp/frontend/matter/app/managed_components
          key: matter-${{ runner.os }}-idf-v5.5-${{ matrix.target }}-${{ hashFiles('.github/scripts/build_matter_firmware.sh', 'src/cpp/frontend/matter/app/dependencies.lock', 'src/cpp/frontend/matter/app/main/idf_component.yml', 'src/cpp/frontend/matter/app/sdkconfig*.defaults', 'src/cpp/frontend/matter/app/partitions.csv') }}
          restore-keys: |
            matter-${{ runner.os }}-idf-v5.5-${{ matrix.target }}-
            matter-${{ runner.os }}-idf-v5.5-

      - name: Build Matter firmware
        run: |
          mkdir -p output
          .github/scripts/build_matter_firmware.sh
        env:
          MATTER_TARGET: ${{ matrix.target }}
          MATTER_OUTPUT: ${{ github.workspace }}/output/espectre-matter-${{ github.ref_name }}-${{ matrix.target }}.bin

      - name: Upload Matter firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-matter-${{ matrix.chip }}
          path: output/espectre-matter-*.bin
          retention-days: 7

  build-native:
    name: Build native ${{ matrix.chip }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: ESP32
            target: esp32
          - chip: ESP32-C3
            target: esp32c3
          - chip: ESP32-C5
            target: esp32c5
          - chip: ESP32-C6
            target: esp32c6
          - chip: ESP32-S3
            target: esp32s3

    steps:
      - uses: actions/checkout@v7

      - name: Cache native toolchain
        uses: actions/cache@v6
        with:
          path: .github/.cache/native-home
          key: native-${{ runner.os }}-idf-v5.5-${{ matrix.target }}-${{ hashFiles('.github/scripts/build_native_firmware.sh', 'src/cpp/frontend/native/app/dependencies.lock', 'src/cpp/frontend/native/app/sdkconfig*.defaults', 'src/cpp/frontend/native/app/partitions.csv') }}
          restore-keys: |
            native-${{ runner.os }}-idf-v5.5-${{ matrix.target }}-
            native-${{ runner.os }}-idf-v5.5-

      - name: Build native firmware
        run: |
          mkdir -p output
          bash .github/scripts/build_native_firmware.sh
        env:
          NATIVE_TARGET: ${{ matrix.target }}
          NATIVE_OUTPUT: ${{ github.workspace }}/output/espectre-native-${{ github.ref_name }}-${{ matrix.target }}.bin
          NATIVE_OTA_OUTPUT: ${{ github.workspace }}/output/espectre-native-${{ github.ref_name }}-${{ matrix.target }}-ota.bin

      - name: Upload native firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-native-${{ matrix.chip }}
          path: output/espectre-native-*.bin
          retention-days: 7

  release:
    name: Create Release
    needs: [build, build-matter, build-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: write
    
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Download all firmware artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          path: firmware
          merge-multiple: true
      
      - name: List firmware files
        run: ls -la firmware/

      - name: Verify firmware matrix and build release manifests
        run: |
          python .github/scripts/build_firmware_manifest.py \
            --firmware-dir firmware \
            --output "firmware/firmware-manifest-${GITHUB_REF_NAME}.json" \
            --channel stable \
            --version "${GITHUB_REF_NAME}" \
            --release-tag "${GITHUB_REF_NAME}" \
            --native-ota-manifest-dir firmware \
            --require-complete-matrix

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME}"
          
          # Extract section for this version from CHANGELOG.md
          # Matches from "## [version]" until the next "## [" or end of file
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ { 
              if (found) exit
              if (index($0, "[" ver "]")) found=1
            }
            found { print }
          ' docs/CHANGELOG.md)
          
          # Extract title from first line
          # Format: "## [2.5.0] - 2026-02-08 - Title Here" or "## [2.5.0] - in progress - Title Here"
          FIRST_LINE=$(echo "$NOTES" | head -1)
          
          # Split by " - " and get the third part (title)
          # ## [2.5.0] - in progress - Title  →  parts: "[2.5.0]", "in progress", "Title"
          TITLE=$(echo "$FIRST_LINE" | awk -F ' - ' '{print $3}')
          
          # Clean up title
          TITLE=$(echo "$TITLE" | xargs)  # Trim whitespace
          
          # If no title, use generic
          if [ -z "$TITLE" ]; then
            TITLE="Release"
          fi
          
          # If no specific version found, use generic message
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG.md](https://github.com/francescopace/espectre/blob/main/docs/CHANGELOG.md) for details."
            TITLE="Release"
          else
            # Remove first line (header) from body - it's already in the release title
            NOTES=$(echo "$NOTES" | tail -n +2)
          fi
          
          # Save to file for the release action
          echo "$NOTES" > release_notes.md
          
          # Save title for release name
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          
          echo "=== Release: v${VERSION} - ${TITLE} ==="
          cat release_notes.md
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "v${{ github.ref_name }} - ${{ steps.changelog.outputs.title }}"
          body_path: release_notes.md
          files: |
            firmware/*.bin
            firmware/*.json
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          discussion_category_name: "Announcements"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pages:
    name: Publish Web Flash Pages
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Documentation
        run: python .github/scripts/build_docs.py

      - name: Build Search Index
        run: npx -y pagefind --site docs/web --output-path docs/web/_pagefind --glob "documentation/**/*.html"

      - name: Download stable firmware artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          path: stable-firmware
          merge-multiple: true

      - name: Stage stable web firmware
        run: |
          python .github/scripts/stage_web_firmware.py \
            --firmware-dir stable-firmware \
            --output-dir docs/web/flash/firmware/stable \
            --channel stable \
            --version "${GITHUB_REF_NAME}" \
            --release-tag "${GITHUB_REF_NAME}" \
            --url-prefix /flash/firmware/stable

      - name: Download snapshot release assets
        run: |
          mkdir -p snapshot-firmware
          if gh release view snapshot >/dev/null 2>&1; then
            gh release download snapshot --pattern '*.bin' --dir snapshot-firmware --clobber
          else
            echo "No snapshot release found; skipping main channel staging."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Stage main web firmware
        run: |
          if ls snapshot-firmware/*.bin >/dev/null 2>&1; then
            SNAPSHOT_COMMIT="$(gh release view snapshot --json targetCommitish --jq '.targetCommitish // ""')"
            python .github/scripts/stage_web_firmware.py \
              --firmware-dir snapshot-firmware \
              --output-dir docs/web/flash/firmware/main \
              --channel main \
              --version main \
              --release-tag snapshot \
              --url-prefix /flash/firmware/main \
              --commit "$SNAPSHOT_COMMIT"
          else
            echo "No snapshot firmware downloaded; leaving main channel empty."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Verify Build
        run: |
          test -f docs/web/sitemap.xml
          test -d docs/web/documentation
          test -d docs/web/_pagefind
          test -f docs/web/flash/firmware/stable/firmware-manifest-stable.json
          test "$(find docs/web/flash/firmware/stable -maxdepth 1 -type f -name '*.bin' | wc -l | tr -d ' ')" -eq 15
          echo "Web flash Pages build verified!"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/web

  deploy-pages:
    name: Deploy Web Flash Pages
    needs: publish-pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
