name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'      # Match: 2.5.0, 1.0.0, etc.
      - '[0-9]+.[0-9]+.[0-9]+-*'    # Match: 2.5.0-rc1, 2.5.0-beta, etc.

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate Release Source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify tag, changelog, version, and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main \
            || { echo "Release commit is not reachable from main." >&2; exit 1; }
          python3 .github/scripts/validate_release.py --tag "${RELEASE_TAG}"

      - name: Require a successful main CI run for this commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "ci.yml",
              branch: "main",
              head_sha: context.sha,
              status: "success",
              per_page: 100
            });
            const valid = response.data.workflow_runs.find((run) =>
              run.event === "push" &&
              run.head_branch === "main" &&
              run.head_sha === context.sha &&
              run.conclusion === "success"
            );
            if (!valid) {
              core.setFailed(`No successful main CI push run found for ${context.sha}.`);
            } else {
              core.info(`Release is gated by successful CI run ${valid.id}.`);
            }

  build-esphome:
    name: Build ESPHome ${{ matrix.chip }}
    needs: validate-release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: ESP32
            config: src/cpp/frontend/esphome/examples/espectre-esp32.yaml
          - chip: ESP32-S3
            config: src/cpp/frontend/esphome/examples/espectre-s3.yaml
          - chip: ESP32-C3
            config: src/cpp/frontend/esphome/examples/espectre-c3.yaml
          - chip: ESP32-C5
            config: src/cpp/frontend/esphome/examples/espectre-c5.yaml
          - chip: ESP32-C6
            config: src/cpp/frontend/esphome/examples/espectre-c6.yaml
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      
      - name: Install ESPHome
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Compile
        env:
          ESPECTRE_GIT_VERSION: ${{ github.ref_name }}
        run: esphome -s git_ref "${GITHUB_REF_NAME}" -s project_version "${GITHUB_REF_NAME}" -s detection_algorithm lightweight compile "${{ matrix.config }}"
      
      - name: Rename firmware files
        run: |
          mkdir -p output
          VERSION="${GITHUB_REF_NAME}"
          CHIP=$(echo "${{ matrix.chip }}" | tr '[:upper:]' '[:lower:]' | tr -d '-')
          find src/cpp/frontend/esphome/examples/.esphome/build -name "firmware.factory.bin" -exec cp {} output/ \;
          mv "output/firmware.factory.bin" "output/espectre-${VERSION}-${CHIP}.bin"

      - name: Build ESPHome compliance artifacts
        run: |
          PROJECT_DESCRIPTION="$(find src/cpp/frontend/esphome/examples/.esphome/build -path '*/build/project_description.json' -print -quit)"
          FIRMWARE="$(find output -maxdepth 1 -type f -name 'espectre-*.bin' -print -quit)"
          test -n "${PROJECT_DESCRIPTION}"
          test -n "${FIRMWARE}"
          python .github/scripts/build_firmware_compliance.py \
            --frontend esphome \
            --project-description "${PROJECT_DESCRIPTION}" \
            --firmware "${FIRMWARE}" \
            --output-dir output
      
      - name: Upload firmware artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: firmware-${{ matrix.chip }}
          path: output/espectre-${{ github.ref_name }}-*
          retention-days: 7

  build-matter:
    name: Build Matter ${{ matrix.chip }}
    needs: validate-release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: ESP32
            target: esp32
          - chip: ESP32-C3
            target: esp32c3
          - chip: ESP32-C5
            target: esp32c5
          - chip: ESP32-C6
            target: esp32c6
          - chip: ESP32-S3
            target: esp32s3

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Keep dependencies and compiled objects per target. The target suffix
      # prevents parallel matrix jobs from competing to populate one cache.
      - name: Cache Matter toolchain, components, and compiler objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .github/.cache/matter-home
            src/cpp/frontend/matter/app/managed_components
          key: matter-${{ runner.os }}-idf-v5.5-build-v3-${{ matrix.target }}-${{ hashFiles('requirements.txt', 'src/cpp/frontend/matter/app/main/idf_component.yml', 'src/cpp/frontend/matter/app/sdkconfig.defaults*') }}
          restore-keys: |
            matter-${{ runner.os }}-idf-v5.5-build-v3-${{ matrix.target }}-
            matter-${{ runner.os }}-idf-v5.5-deps-v2-

      - name: Build Matter firmware
        run: |
          mkdir -p output
          .github/scripts/build_matter_firmware.sh
        env:
          MATTER_TARGET: ${{ matrix.target }}
          MATTER_OUTPUT: ${{ github.workspace }}/output/espectre-matter-${{ github.ref_name }}-${{ matrix.target }}.bin
          MATTER_SDKCONFIG_DEFAULTS: ${{ matrix.target == 'esp32' && 'sdkconfig.defaults;sdkconfig.defaults.esp32' || '' }}

      - name: Upload Matter firmware artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: firmware-matter-${{ matrix.chip }}
          path: output/espectre-matter-*
          retention-days: 7

  build-native:
    name: Build native ${{ matrix.chip }}
    needs: validate-release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: ESP32
            target: esp32
          - chip: ESP32-C3
            target: esp32c3
          - chip: ESP32-C5
            target: esp32c5
          - chip: ESP32-C6
            target: esp32c6
          - chip: ESP32-S3
            target: esp32s3

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # The cached home contains target-independent Python and component dependencies.
      - name: Cache native toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .github/.cache/native-home
          key: native-${{ runner.os }}-idf-v5.5-deps-v2-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            native-${{ runner.os }}-idf-v5.5-deps-v2-

      - name: Build native firmware
        run: |
          mkdir -p output
          bash .github/scripts/build_native_firmware.sh
        env:
          NATIVE_TARGET: ${{ matrix.target }}
          NATIVE_OUTPUT: ${{ github.workspace }}/output/espectre-native-${{ github.ref_name }}-${{ matrix.target }}.bin
          NATIVE_OTA_OUTPUT: ${{ github.workspace }}/output/espectre-native-${{ github.ref_name }}-${{ matrix.target }}-ota.bin
          NATIVE_SDKCONFIG_DEFAULTS: ${{ matrix.target == 'esp32' && 'sdkconfig.defaults;sdkconfig.defaults.esp32' || '' }}

      - name: Upload native firmware artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: firmware-native-${{ matrix.chip }}
          path: output/espectre-native-*
          retention-days: 7

  build-sdk:
    name: Build SDK Package
    needs: validate-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Build SDK package
        run: |
          mkdir -p output
          python .github/scripts/build_sdk_package.py \
            --channel release \
            --version "${GITHUB_REF_NAME}" \
            --release-tag "${GITHUB_REF_NAME}" \
            --output-dir output \
            --commit "${GITHUB_SHA}"

      - name: Upload SDK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdk-bundle
          path: |
            output/espectre-sdk-*.tar.gz
            output/espectre-sdk-*.zip
            output/sdk-manifest-*.json
          retention-days: 7

  release:
    name: Create Release
    needs: [build-esphome, build-matter, build-native, build-sdk]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      discussions: write
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Download all firmware artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: firmware-*
          path: firmware
          merge-multiple: true

      - name: Download SDK package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: sdk-*
          path: sdk
          merge-multiple: true
      
      - name: List firmware files
        run: ls -la firmware/

      - name: List SDK files
        run: ls -la sdk/

      - name: Verify firmware matrix and build release manifests
        run: |
          python .github/scripts/build_firmware_manifest.py \
            --firmware-dir firmware \
            --output "firmware/firmware-manifest-${GITHUB_REF_NAME}.json" \
            --channel release \
            --version "${GITHUB_REF_NAME}" \
            --release-tag "${GITHUB_REF_NAME}" \
            --commit "${GITHUB_SHA}" \
            --native-ota-manifest-dir firmware \
            --require-complete-matrix

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME}"
          
          # Extract section for this version from CHANGELOG.md
          # Matches from "## [version]" until the next "## [" or end of file
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ { 
              if (found) exit
              if (index($0, "[" ver "]")) found=1
            }
            found { print }
          ' docs/CHANGELOG.md)
          
          # Extract title from first line
          # Format: "## [2.5.0] - 2026-02-08 - Title Here" or "## [2.5.0] - in progress - Title Here"
          FIRST_LINE=$(echo "$NOTES" | head -1)
          
          # Split by " - " and get the third part (title)
          # ## [2.5.0] - in progress - Title  →  parts: "[2.5.0]", "in progress", "Title"
          TITLE=$(echo "$FIRST_LINE" | awk -F ' - ' '{print $3}')
          
          # Clean up title
          TITLE=$(echo "$TITLE" | xargs)  # Trim whitespace
          
          # If no title, use generic
          if [ -z "$TITLE" ]; then
            TITLE="Release"
          fi
          
          # If no specific version found, use generic message
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG.md](https://github.com/francescopace/espectre/blob/main/docs/CHANGELOG.md) for details."
            TITLE="Release"
          else
            # Remove first line (header) from body - it's already in the release title
            NOTES=$(echo "$NOTES" | tail -n +2)
          fi
          
          # Save to file for the release action
          echo "$NOTES" > release_notes.md
          
          # Save title for release name
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          
          echo "=== Release: v${VERSION} - ${TITLE} ==="
          cat release_notes.md
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "v${{ github.ref_name }} - ${{ steps.changelog.outputs.title }}"
          body_path: release_notes.md
          files: |
            firmware/*
            sdk/*.tar.gz
            sdk/*.zip
            sdk/*.json
            LICENSE
            LICENSING.md
            THIRD_PARTY_NOTICES.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          discussion_category_name: "Announcements"
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pages:
    name: Publish Website
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download release firmware artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: firmware-*
          path: release-firmware
          merge-multiple: true

      - name: Download release SDK artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: sdk-*
          path: release-sdk
          merge-multiple: true

      - name: Stage release web firmware
        run: |
          python .github/scripts/stage_web_firmware.py \
            --firmware-dir release-firmware \
            --output-dir docs/web/artifacts/firmware/release \
            --channel release \
            --version "${GITHUB_REF_NAME}" \
            --release-tag "${GITHUB_REF_NAME}" \
            --url-prefix /artifacts/firmware/release

      - name: Stage release web SDK
        run: |
          python .github/scripts/stage_web_sdk.py \
            --sdk-dir release-sdk \
            --output-dir docs/web/artifacts/sdk/release \
            --channel release

      - name: Download preview release assets
        run: |
          mkdir -p preview-firmware
          mkdir -p preview-sdk
          if gh release view snapshot >/dev/null 2>&1; then
            gh release download snapshot --pattern '*.bin' --pattern '*-sbom.spdx.json' --pattern '*-THIRD_PARTY_NOTICES.txt' --pattern '*-third-party-licenses.zip' --dir preview-firmware --clobber
            gh release download snapshot --pattern 'espectre-sdk-*' --pattern 'sdk-manifest-*.json' --dir preview-sdk --clobber
          else
            echo "No preview release found; skipping preview channel staging."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Stage preview web firmware
        run: |
          if ls preview-firmware/*.bin >/dev/null 2>&1; then
            PREVIEW_COMMIT="$(gh release view snapshot --json targetCommitish --jq '.targetCommitish // ""')"
            python .github/scripts/stage_web_firmware.py \
              --firmware-dir preview-firmware \
              --output-dir docs/web/artifacts/firmware/preview \
              --channel preview \
              --version "$(python3 .github/scripts/detect_git_version.py --from-sdk-dir preview-sdk)" \
              --release-tag snapshot \
              --url-prefix /artifacts/firmware/preview \
              --commit "$PREVIEW_COMMIT"
          else
            echo "No preview firmware downloaded; leaving preview channel empty."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Stage preview web SDK
        run: |
          if ls preview-sdk/sdk-manifest-*.json >/dev/null 2>&1; then
            python .github/scripts/stage_web_sdk.py \
              --sdk-dir preview-sdk \
              --output-dir docs/web/artifacts/sdk/preview \
              --channel preview
          else
            echo "No preview SDK downloaded; leaving preview SDK channel empty."
          fi

      - name: Download develop release assets
        id: develop-assets
        run: |
          mkdir -p develop-firmware
          mkdir -p develop-sdk
          if gh release view snapshot-dev >/dev/null 2>&1; then
            gh release download snapshot-dev --pattern '*.bin' --pattern '*-sbom.spdx.json' --pattern '*-THIRD_PARTY_NOTICES.txt' --pattern '*-third-party-licenses.zip' --dir develop-firmware --clobber
            gh release download snapshot-dev --pattern 'espectre-sdk-*' --pattern 'sdk-manifest-*.json' --dir develop-sdk --clobber
            python .github/scripts/stage_web_firmware.py \
              --firmware-dir develop-firmware \
              --output-dir docs/web/artifacts/firmware/develop \
              --channel develop \
              --version "$(python3 .github/scripts/detect_git_version.py --from-sdk-dir develop-sdk)" \
              --release-tag snapshot-dev \
              --url-prefix /artifacts/firmware/develop \
              --commit "$(gh release view snapshot-dev --json targetCommitish --jq '.targetCommitish // ""')"
            python .github/scripts/stage_web_sdk.py \
              --sdk-dir develop-sdk \
              --output-dir docs/web/artifacts/sdk/develop \
              --channel develop
            echo "staged=true" >> "$GITHUB_OUTPUT"
          else
            echo "No develop release found; skipping develop channel staging."
            echo "staged=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Build and verify Pages tree
        uses: ./.github/actions/build-pages
        with:
          require-preview: "true"
          require-release: "true"
          require-develop: ${{ steps.develop-assets.outputs.staged }}

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/web

  deploy-pages:
    name: Deploy Website
    needs: publish-pages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Notify IndexNow
        run: python3 .github/scripts/notify_indexnow.py
