version: "3.0.0"
description: "ESPectre shared core and ESP-IDF runtime layers. Dual-licensed: GPL-3.0-only, or a commercial license for proprietary firmware."
license: "GPL-3.0-only"
url: "https://espectre.dev/sdk/"
repository: "https://github.com/francescopace/espectre.git"
repository_info:
  path: "src/cpp"
documentation: "https://espectre.dev/sdk/"
issues: "https://github.com/francescopace/espectre/issues"
maintainers:
  - "Francesco Pace <contact@espectre.dev>"
tags:
  - csi
  - sensing
  - motion-detection
targets:
  - esp32
  - esp32s2
  - esp32s3
  - esp32c3
  - esp32c5
  - esp32c6
files:
  exclude:
    - "frontend/**"
    - "AGENTS.md"
    - "Doxyfile"
    - "espectre_git_version.cmake"
dependencies:
  idf:
    version: ">=5.5.5,<5.6.0"
  espressif/mdns:
    version: "1.12.0"
  espressif/esp_tinyusb:
    version: "^2.0.0"
    rules:
      - if: "target == esp32s2"
