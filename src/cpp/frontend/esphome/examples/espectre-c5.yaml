# ESPectre - ESP32-C5 Configuration
# WiFi CSI-based motion detection with Home Assistant integration
#
# TESTED: This platform is validated for HT20 CSI motion detection.
# ESP32-C5 uses the same modern CSI API as ESP32-C6 with WiFi 6 support.
# ESPectre defaults to 2.4 GHz HT20 and remaps 57->64 subcarriers at runtime.
# This dual-band board can select 5 GHz or auto explicitly, but detection
# quality on 5 GHz is not characterized yet.
#
# Compatible boards:
# - ESP32-C5-DevKitC
# - ESP32-C5-DevKitM
# - Any ESP32-C5 board
#
# Provisioning:
# - Via BLE: Use the ESPHome app or Home Assistant companion app
# - Via WiFi: Connect to "ESPectre Fallback" AP and configure
# Note: USB provisioning (improv_serial) not yet supported on ESP32-C5

substitutions:
  git_ref: main # branch, tag, or commit
  # Device Builder: pin git_ref to a numeric release tag. A branch name is not a firmware version, and the GitHub clone has no git tags.
  project_version: ${git_ref} # firmware identity; first-party CI sets git describe
  detection_algorithm: lightweight # lightweight (default) or high_accuracy

esphome:
  name: espectre
  friendly_name: ESPectre
  min_version: 2026.7.0
  # Uncomment the next line if you have multiple ESPectre devices (adds MAC suffix to name)
  # name_add_mac_suffix: true
  project:
    name: francescopace.espectre
    version: ${project_version}

esp32:
  variant: ESP32C5
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

# Load ESPectre component from GitHub
external_components:
  - source:
      type: git
      url: https://github.com/francescopace/espectre
      ref: ${git_ref}
      path: src/cpp/frontend/esphome/components
    components: [ espectre ]
    refresh: always

# ESPectre - WiFi CSI Motion Detection
espectre:
  id: espectre_csi
  detection_algorithm: ${detection_algorithm}

# Dashboard import for easy adoption
dashboard_import:
  package_import_url: github://francescopace/espectre/src/cpp/frontend/esphome/examples/espectre-c5.yaml@${git_ref}

# WiFi with fallback AP for provisioning
wifi:
  # Optional on ESP32-C5; ESPHome defaults to AUTO when omitted. This example
  # selects the 2.4 GHz HT20 band covered by ESPectre's production corpus.
  band_mode: 2.4GHz
  ap:
    ssid: "ESPectre Fallback"

captive_portal:

# Improv provisioning via BLE
esp32_improv:
  authorizer: none

# Note: improv_serial is not yet supported on ESP32-C5

# Logging
logger:
  #hardware_uart: UART0  # Uncomment for boards with external USB-UART bridges (CH340, CP2102, etc.)

# Home Assistant API
api:

# OTA updates
ota:
  - platform: esphome
