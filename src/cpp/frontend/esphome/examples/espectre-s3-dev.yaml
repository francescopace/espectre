# ESPectre - ESP32-S3 Dev (local components)
# Usage: esphome run src/cpp/frontend/esphome/examples/espectre-s3-dev.yaml

esphome:
  name: espectre
  friendly_name: ESPectre
  min_version: 2026.6.0
  # Uncomment the next line if you have multiple ESPectre devices (adds MAC suffix to name)
  # name_add_mac_suffix: true
  project:
    name: francescopace.espectre
    version: dev

esp32:
  variant: ESP32S3
  toolchain: platformio
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

# PSRAM support (8MB on most S3 boards)
psram:
  mode: octal
  speed: 80MHz

# Local component for development
external_components:
  - source:
      type: local
      path: ../components
    components: [ espectre ]

# ESPectre - WiFi CSI Motion Detection
# All parameters shown with defaults
espectre:
  id: espectre_csi
  debug_telemetry: true
  # Traffic Generator
  traffic_generator_rate: 100   # Target CSI packets/sec (0-100000; practical rates are much lower)
  traffic_generator_mode: ping   # ping (default) or dns
  # Detection Algorithm
  detection_algorithm: classic  # classic (default) or ml (neural network)
  # Segmentation parameters
  segmentation_window_size_ms: 1000  # Analysis window duration in milliseconds (1000-2000)
  # Filters
  hampel_enabled: true          # Outlier removal (default: true)
  hampel_window: 7              # Filter window size (3-11, odd numbers)
  hampel_threshold: 5.0         # Outlier detection threshold (1.0-10.0)
  lowpass_enabled: false        # Noise reduction (default: false)
  lowpass_cutoff: 11.0          # Cutoff frequency in Hz (5.0-20.0)

# WiFi for development
wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      #bssid: !secret wifi_bssid  # Lock to specific Access Point (useful for mesh networks)

# Logging
logger:
  level: DEBUG
  logs:
    sensor: INFO
    binary_sensor: INFO

# Home Assistant API
api:

# OTA updates
ota:
  - platform: esphome

debug:
  update_interval: 5s

sensor:
  - platform: debug
    free:
      name: "Free Heap"
    block:
      name: "Max Free Block"
    loop_time:
      name: "Loop Time"

text_sensor:
  - platform: debug
    device:
      name: "Device Info"
    reset_reason:
      name: "Reset Reason"
