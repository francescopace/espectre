# ESPectre - Home Assistant Dashboard
#
# How to use:
# 1. Go to Settings → Dashboards → Add Dashboard
# 2. Open the new dashboard and click "Edit" (pencil icon)
# 3. Click the three dots menu → "Raw configuration editor"
# 4. Replace ALL content with this YAML (delete the default content first)
# 5. Click "Save"
#
# Note: If you changed the device name from "espectre", replace all
# entity prefixes to match Home Assistant entity IDs. Depending on the
# frontend, IDs may look like:
#   sensor.espectre_intensity                 (ESPHome)
#   number.espectre_threshold                 (ESPHome)
#   switch.espectre_calibrate                 (ESPHome)
#   sensor.native_0x0000111122223333_intensity (Native MQTT Discovery)
#   number.native_0x0000111122223333_threshold (Native MQTT Discovery)
#   switch.native_0x0000111122223333_calibrate (Native MQTT Discovery)
#   sensor.micro_micro_espectre_intensity     (Micro-ESPectre MQTT Discovery)
#   number.micro_micro_espectre_threshold     (Micro-ESPectre MQTT Discovery)
#   switch.micro_micro_espectre_calibrate     (Micro-ESPectre MQTT Discovery)
# Check Settings → Devices & services → Entities for the exact IDs.
#
# Intensity is the shared Home Assistant gauge on ESPHome, Native MQTT, and
# Micro-ESPectre MQTT (movement / threshold × 50, clamped to 100) on the
# detector evaluation cadence (default 250 ms). 50% is at threshold; 100% is
# twice the threshold. No HA template sensor is needed.
#
# ⚠️ Multiple devices? If you uncommented "name_add_mac_suffix: true" in your
# device YAML, entity names will include the MAC suffix (e.g., "espectre_a1b2c3").
# Replace "espectre_" with "espectre_XXXXXX_" where XXXXXX is your MAC suffix.

views:
  - title: ESPectre
    type: sections
    sections:
      - type: grid
        cards:
          - type: gauge
            name: Intensity
            min: 0
            max: 100
            needle: true
            segments:
              - from: 0
                color: green
              - from: 35
                color: yellow
              - from: 50
                color: red
            entity: >-
              sensor.espectre_intensity
          - type: history-graph
            grid_options:
              columns: 12
              rows: 4
            entities:
              - entity: sensor.espectre_movement_score
                name: Movement
              - entity: number.espectre_threshold
                name: Threshold
            title: ESPectre
            hours_to_show: 1
      - type: grid
        cards:
          - type: tile
            grid_options:
              columns: 12
              rows: 1
            entity: binary_sensor.espectre_motion_detected
            name: Motion
            show_entity_picture: false
            hide_state: false
            state_content:
              - state
              - last_changed
            vertical: false
            features_position: bottom
          - type: entities
            entities:
              - entity: number.espectre_threshold
                icon: mdi:tune-vertical
                name: Threshold
              - entity: switch.espectre_calibrate
                icon: mdi:refresh
                name: Recalibrate
            show_header_toggle: false
            state_color: false
          # Optional ESPHome platform debug sensors (free / block / loop_time).
          # These require the corresponding platform: debug configuration. See
          # src/cpp/frontend/esphome/examples/espectre-*-dev.yaml.
          # - type: entities
          #   title: Debug Sensors
          #   entities:
          #     - entity: sensor.espectre_free_heap
          #       name: Free Heap
          #     - entity: sensor.espectre_max_free_block
          #       name: Max Free Block
          #     - entity: sensor.espectre_loop_time
          #       name: Loop Time
          #   show_header_toggle: false
          #   state_color: false
          # ESPectre diagnostics are always available. Press Refresh Diagnostics
          # to publish the latest cached values to Home Assistant.
          # - type: entities
          #   title: ESPectre Diagnostics
          #   entities:
          #     - entity: button.espectre_refresh_diagnostics
          #       name: Refresh Diagnostics
          #     - entity: sensor.espectre_traffic_tx_rate
          #       name: Traffic TX Rate
          #     - entity: sensor.espectre_csi_callback_rate
          #       name: CSI Callback Rate
          #     - entity: sensor.espectre_csi_accepted_rate
          #       name: CSI Accepted Rate
          #     - entity: sensor.espectre_csi_filtered_rate
          #       name: CSI Filtered Rate
          #     - entity: sensor.espectre_wifi_channel
          #       name: WiFi Channel
          #     - entity: sensor.espectre_wifi_rssi
          #       name: WiFi RSSI
          #   show_header_toggle: false
          #   state_color: false
    cards: []
