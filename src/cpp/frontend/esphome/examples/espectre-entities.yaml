# Home Assistant entities of the ESPectre examples.
# The names match the entities of earlier ESPectre images, so dashboards and automations keep working.

binary_sensor:
  - platform: espectre
    motion:
      id: espectre_motion_detected
      name: "Motion Detected"
    calibrating:
      id: espectre_calibration_active
      name: "Calibration Active"

sensor:
  - platform: espectre
    movement:
      id: espectre_movement_score
      name: "Movement Score"
    # Published when Refresh Diagnostics is pressed.
    diagnostics:
      id: espectre_diagnostics
      generator_rate:
        name: "Generator Rate"
      traffic_tx_rate:
        name: "Traffic TX Rate"
      traffic_rx_rate:
        name: "Traffic RX Rate"
      csi_callback_rate:
        name: "CSI Callback Rate"
      csi_accepted_rate:
        name: "CSI Accepted Rate"
      csi_missing_slot_rate:
        name: "CSI Missing Slot Rate"
      csi_excess_rate:
        name: "CSI Excess Rate"
      csi_occupancy:
        name: "CSI Temporal Occupancy"
  - platform: wifi_signal
    id: espectre_wifi_rssi
    name: "WiFi RSSI"
    update_interval: never

number:
  - platform: espectre
    threshold:
      id: espectre_threshold
      name: "Threshold"
    motion_on_hits:
      name: "Motion On Hits"
    motion_off_hits:
      name: "Motion Off Hits"

select:
  - platform: espectre
    detection_algorithm:
      name: "Detection Profile"
    traffic_generator_mode:
      name: "CSI Traffic Source"
    csi_sample_spacing:
      name: "CSI Packet Spacing"

switch:
  - platform: espectre
    sensing:
      name: "Sensing Enabled"

button:
  - platform: espectre
    id: espectre_recalibrate
    name: "Recalibrate"
  - platform: template
    name: "Refresh Diagnostics"
    entity_category: diagnostic
    icon: "mdi:refresh"
    on_press:
      - component.update: espectre_diagnostics
      - component.update: espectre_wifi_rssi
