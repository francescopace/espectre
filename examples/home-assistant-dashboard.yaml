# ESPectre - Home Assistant Dashboard
#
# How to use:
# 1. Go to Settings → Dashboards → Add Dashboard
# 2. Open the new dashboard and click "Edit" (pencil icon)
# 3. Click the three dots menu → "Raw configuration editor"
# 4. Replace ALL content with this YAML (delete the default content first)
# 5. Click "Save"
#
# Note: If you changed the device name from "espectre", replace all
# entity prefixes to match Home Assistant entity IDs. Depending on the
# ESPHome device name, IDs may look like:
#   sensor.espectre_intensity
#   sensor.bedroom_espectre_intensity
# Check Settings → Devices & services → Entities for the exact IDs.
#
# Intensity is published by the ESPHome firmware as intensity_sensor
# (movement / threshold × 100, clamped to 200). No HA template sensor is needed.
#
# ⚠️ Multiple devices? If you uncommented "name_add_mac_suffix: true" in your
# device YAML, entity names will include the MAC suffix (e.g., "espectre_a1b2c3").
# Replace "espectre_" with "espectre_XXXXXX_" where XXXXXX is your MAC suffix.

views:
  - title: ESPectre
    type: sections
    sections:
      - type: grid
        cards:
          - type: gauge
            name: Intensity
            min: 0
            max: 200
            needle: true
            segments:
              - from: 0
                color: green
              - from: 70
                color: yellow
              - from: 100
                color: red
            entity: >-
              sensor.espectre_intensity
          - type: history-graph
            grid_options:
              columns: 12
              rows: 4
            entities:
              - entity: sensor.espectre_movement_score
                name: Movement
              - entity: number.espectre_threshold
                name: Threshold
            title: ESPectre
            hours_to_show: 1
      - type: grid
        cards:
          - type: tile
            grid_options:
              columns: 12
              rows: 1
            entity: binary_sensor.espectre_motion_detected
            name: Motion
            show_entity_picture: false
            hide_state: false
            state_content:
              - state
              - last_changed
            vertical: false
            features_position: bottom
          - type: entities
            entities:
              - entity: number.espectre_threshold
                icon: mdi:tune-vertical
                name: Threshold
              - entity: switch.espectre_calibrate
                icon: mdi:refresh
                name: Recalibrate
            show_header_toggle: false
            state_color: false
          # Optional: requires ESPHome debug sensors enabled in the device YAML
          # (platform: debug → free / block / loop_time). See examples/espectre-*-dev.yaml.
          # - type: entities
          #   title: Debug Sensors
          #   entities:
          #     - entity: sensor.espectre_free_heap
          #       name: Free Heap
          #     - entity: sensor.espectre_max_free_block
          #       name: Max Free Block
          #     - entity: sensor.espectre_loop_time
          #       name: Loop Time
          #   show_header_toggle: false
          #   state_color: false
    cards: []
