# ESPectre - ESP32-C3 Dev (local components)
# Usage: esphome run examples/espectre-c3-dev.yaml

esphome:
  name: espectre
  friendly_name: ESPectre
  min_version: 2026.5.0
  # Uncomment the next line if you have multiple ESPectre devices (adds MAC suffix to name)
  # name_add_mac_suffix: true
  # Uncomment for ESP32-C3 Super Mini clones with flash issues (use DIO instead of QIO)
  # platformio_options:
  #   board_build.flash_mode: dio
  project:
    name: francescopace.espectre
    version: dev

esp32:
  variant: ESP32C3
  framework:
    type: esp-idf

# Local component for development
external_components:
  - source:
      type: local
      path: ../src/cpp/frontend/esphome
    components: [ espectre ]

# ESPectre - WiFi CSI Motion Detection
# Note: For Super Mini boards, keep traffic_generator_rate <= 94
# All parameters shown with defaults
espectre:
  id: espectre_csi
  # Traffic Generator
  traffic_generator_rate: 100   # Packets/sec for CSI generation (0-1000)
  traffic_generator_mode: ping   # ping (default) or dns
  # Gain Lock Mode
  gain_lock: auto               # auto (default), enabled, disabled
  # Detection Algorithm
  detection_algorithm: ml      # mvs (default) or ml (neural network)
  # Segmentation parameters
  segmentation_window_size: 100  # Analysis window size in packets (10-200)
  segmentation_threshold: auto  # auto/min (mvs/ml: 0.0-10.0)
  # Filters
  hampel_enabled: true         # Outlier removal (default: true)
  hampel_window: 7              # Filter window size (3-11, odd numbers)
  hampel_threshold: 5.0         # Outlier detection threshold (1.0-10.0)
  lowpass_enabled: false        # Noise reduction (default: false)
  lowpass_cutoff: 11.0          # Cutoff frequency in Hz (5.0-20.0)

# WiFi (using secrets for development)
wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      bssid: !secret wifi_bssid  # Lock to specific Access Point (useful for mesh networks)

# Logging
logger:
  level: DEBUG
  logs:
    sensor: INFO
    binary_sensor: INFO

# Home Assistant API
api:

debug:
  update_interval: 5s

sensor:
  - platform: debug
    free:
      name: "Free Heap"
    block:
      name: "Max Free Block"
    loop_time:
      name: "Loop Time"

text_sensor:
  - platform: debug
    device:
      name: "Device Info"
    reset_reason:
      name: "Reset Reason"
