configuration:
  targets:
    name: 送信先アドレス
    description: >-
      239.255.0.1 のままにすると、グループ内のすべての ESPectre デバイスに単一のマルチキャストストリームで送信できます。マルチキャストが動作しない場合は、各デバイスの IPv4 アドレスに置き換えてください。ホスト名や URL は入力しないでください。同じデバイスにマルチキャストと個別のアドレスの両方で送信しないでください。
  port:
    name: 送信先 UDP ポート
    description: >-
      ESPectre ファームウェアで外部トラフィック用のポートを変更していなければ、5555 のままにしてください。これはデバイス側の受信ポートであり、Home Assistant 上で公開するサービスではありません。
  rate_pps:
    name: 送信先ごとの毎秒パケット数
    description: >-
      ESPectre の標準設定では 100 のままにしてください。デバイスの CSI 目標レートと一致させます。各送信先にこのレートで送信するため、2 台のアドレスにそれぞれ 100 を指定すると、合計で毎秒 200 パケットになります。設定範囲は 1–1000 です。
  source_ip:
    name: 送信元 IPv4 アドレス（詳細設定）
    description: >-
      通常は空欄にして、システムが送信に使うインターフェースを選択できるようにしてください。イーサネットや Wi-Fi などのネットワークインターフェースを指定する必要がある場合に限り、Home Assistant ホストに割り当てられた IPv4 アドレスを入力します。ESPectre デバイスのアドレスは入力しないでください。
  multicast_ttl:
    name: マルチキャスト TTL（ルーターのホップ数上限）
    description: >-
      ネットワークで別の上限が必要な場合を除き、8 のままにしてください。1 にするとマルチキャストはローカルネットワーク内に限定されます。N 台のルーターを通過するには、少なくとも N + 1 が必要です。スイッチはホップ数を消費しません。この設定でルーティングが有効になったり、ファイアウォールを回避したり、ユニキャスト TTL が変わったりすることはありません。設定範囲は 1–255 です。
  dscp:
    name: DSCP トラフィッククラス（詳細設定）
    description: >-
      Expedited Forwarding を要求する場合は 46 のままにし、Best Effort を要求する場合は 0 にしてください。ユニキャストとマルチキャストの両方に適用されます。ネットワーク機器がこのマーキングを無視または変更する場合があります。数値が大きいほど優先度が高いとは限りません。IP TOS 値ではなく、0 から 63 の DSCP コードポイントを入力してください。
