# Codecov Configuration
# https://docs.codecov.com/docs/codecov-yaml

codecov:
  notify:
    wait_for_ci: false

coverage:
  status:
    project:
      cpp_core:
        target: auto
        threshold: 0%
        flags: [cpp]
        paths: ["src/cpp/core/**"]
      cpp_runtime:
        target: auto
        threshold: 0%
        flags: [cpp]
        paths: ["src/cpp/runtime/**"]
      cpp_frontend:
        target: auto
        threshold: 0%
        flags: [cpp]
        paths: ["src/cpp/frontend/**"]
      python:
        target: auto
        threshold: 0%
        flags: [python]
        paths: ["src/python/**"]
    patch:
      cpp:
        target: 90%
        threshold: 0%
        flags: [cpp]
        paths: ["src/cpp/**"]
      python:
        target: 90%
        threshold: 0%
        flags: [python]
        paths: ["src/python/**"]

# Ignore test files and mocks (only track src/)
ignore:
  - "test/**"
  - "**/mock_*.h"
  - "**/mock_*.cpp"

# Comment on PRs
comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: true  # Only comment if coverage changed
